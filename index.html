<style>
:root {
  --bg: #08090a;
  --card: #121417;
  --card-inner: #191c21;
  --line: #23272e;
  --text: #f3f4f6;
  --muted: #8b949e;
  --green: #10b981;
  --green-bg: rgba(16, 185, 129, 0.14);
  --red: #ef4444;
  --red-bg: rgba(239, 68, 68, 0.14);
  --gold: #f59e0b;
  --gold-bg: rgba(245, 158, 11, 0.14);
  color-scheme: dark;
}
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
}
html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg); color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}
body {
  display: flex; flex-direction: column; overflow: hidden;
  padding-top: env(safe-area-inset-top, 0px);
}
.topbar {
  flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center;
  padding: 14px 18px 10px; background: var(--bg); border-bottom: 1px solid var(--line);
}
.topbar h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
.live-badge {
  display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: var(--muted);
  background: var(--card); border: 1px solid var(--line); padding: 5px 10px; border-radius: 999px;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
.dot.sim { background: var(--gold); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

.ticker {
  flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center;
  padding: 10px 18px; background: var(--card); border-bottom: 1px solid var(--line); font-size: 12px;
}
.ticker-price { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 15px; }

.view-container {
  flex: 1 1 auto; overflow-y: auto; padding: 14px 16px 90px; scrollbar-width: none;
}
.view-container::-webkit-scrollbar { display: none; }
.tab-view { display: none; }
.tab-view.active { display: block; animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.sig-card {
  background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 14px;
}
.sig-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.sig-pair-wrap { display: flex; align-items: center; gap: 8px; }
.gold-icon {
  width: 28px; height: 28px; border-radius: 50%;
  background: linear-gradient(135deg, #fbbf24, #d97706);
  display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: #111;
}
.sig-pair { font-weight: 800; font-size: 16px; }
.dir-pill { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 3px; }
.dir-pill.buy { background: var(--green-bg); color: var(--green); }
.dir-pill.sell { background: var(--red-bg); color: var(--red); }
.rr-pill { font-size: 11px; font-weight: 600; color: var(--muted); background: var(--card-inner); border: 1px solid var(--line); padding: 3px 7px; border-radius: 6px; }
.sig-status { font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
.sig-status.active { color: var(--green); }
.sig-status.won { color: var(--green); }
.sig-status.tp1 { color: var(--gold); }
.sig-status.loss { color: var(--red); }

.news-banner {
  background: var(--red-bg); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 12px;
  padding: 10px 14px; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; font-size: 12px; color: #fca5a5; font-weight: 600;
}

.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 8px; }
.lvl-box { background: var(--card-inner); border-radius: 10px; padding: 9px 6px; text-align: center; border: 1px solid rgba(255,255,255,0.03); }
.lvl-box.sl { background: rgba(239, 68, 68, 0.09); border-color: rgba(239, 68, 68, 0.2); }
.lvl-box.tp-hit { background: rgba(16, 185, 129, 0.12); border-color: rgba(16, 185, 129, 0.25); }
.lvl-lbl { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
.lvl-box.sl .lvl-lbl { color: #fca5a5; }
.lvl-box.tp-hit .lvl-lbl { color: #6ee7b7; }
.lvl-val { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; }
.lvl-box.sl .lvl-val { color: var(--red); }
.lvl-box.tp-hit .lvl-val { color: var(--green); }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
.sub-lvl { background: var(--card-inner); border-radius: 8px; padding: 7px 10px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
.sub-lvl.hit { background: rgba(16, 185, 129, 0.12); color: var(--green); }
.sub-lvl span.price { font-family: 'JetBrains Mono', monospace; font-weight: 700; }
.pips-tag { font-size: 10px; font-weight: 600; color: var(--muted); background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px; }

.sig-foot { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); }
.foot-actions { display: flex; gap: 14px; align-items: center; }
.foot-btn { background: none; border: none; color: var(--text); font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; padding: 0; }

.panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
.panel-title { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
.chart-svg { width: 100%; height: 210px; display: block; background: var(--card-inner); border-radius: 10px; }
.row-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.row-item:last-child { border-bottom: none; }
.btn-action { width: 100%; padding: 12px; border-radius: 10px; border: none; background: var(--gold); color: #111; font-weight: 700; font-size: 13px; cursor: pointer; margin-top: 8px; }
.btn-sec { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card-inner); color: var(--text); font-weight: 600; font-size: 12px; cursor: pointer; margin-top: 8px; }
.btn-notif { width: 100%; padding: 11px; border-radius: 10px; border: 1px solid var(--green); background: var(--green-bg); color: var(--green); font-weight: 700; font-size: 12px; cursor: pointer; }

.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; align-items: flex-end; justify-content: center; z-index: 50; }
.modal-bg.open { display: flex; }
.modal-sheet { width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto; background: var(--card); border-top: 1px solid var(--line); border-radius: 20px 20px 0 0; padding: 18px 18px calc(24px + env(safe-area-inset-bottom, 0px)); }

.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; background: rgba(12, 13, 15, 0.96); backdrop-filter: blur(10px);
  border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); padding: 8px 4px calc(8px + env(safe-area-inset-bottom, 0px)); z-index: 30;
}
.nav-item { background: none; border: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: inherit; font-size: 10px; font-weight: 600; cursor: pointer; position: relative; }
.nav-item.active { color: var(--gold); }
.nav-icon { font-size: 18px; line-height: 1; }
.badge-count { position: absolute; top: -2px; right: 24%; background: var(--green); color: #051b11; font-size: 9px; font-weight: 800; padding: 1px 5px; border-radius: 999px; }
</style>

<script>
const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtInt = n => Number(n).toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });

const WORKER_URL = "https://script.google.com/macros/s/AKfycbwoFPgcEw52vFAdloE494I_0EmLb_c0dUdau3qolKnif_Ywe5btJL7qLJ5E8xG7zh-N/exec";
const POLL_MS = 5000;
const CANDLE_POLL_MS = 25000;

let liveOk = false;
const state = { price: 3865.00, hist: [], candles: null, analysis: null, thr: 75, signals: [] };

try {
  const saved = JSON.parse(localStorage.getItem('eb_auto_signals_v10') || '[]');
  if (Array.isArray(saved)) state.signals = saved;
} catch (e) {}

function saveSignals() {
  try { localStorage.setItem('eb_auto_signals_v10', JSON.stringify(state.signals.slice(0, 50))); } catch (e) {}
}

function playAlertTone() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1318.5, ctx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.45);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.45);
  } catch (e) {}
}

function updateNotifUI() {
  if (!('Notification' in window)) return;
  const perm = Notification.permission;
  if (perm === 'granted') { $('notifBanner').style.display = 'none'; $('notifStatusText').textContent = 'AKTIF (ON)'; $('notifStatusText').style.color = 'var(--green)'; }
  else { $('notifBanner').style.display = 'block'; $('notifStatusText').textContent = 'BELUM DIAKTIFKAN'; $('notifStatusText').style.color = 'var(--gold)'; }
}

async function requestNotifPermission() {
  if (!('Notification' in window)) return;
  await Notification.requestPermission();
  updateNotifUI();
}

function sendAppNotification(title, body) {
  playAlertTone();
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  if ('Notification' in window && Notification.permission === 'granted') {
    const opts = { body, icon: 'icon-192.png', badge: 'icon-192.png' };
    if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
      navigator.serviceWorker.ready.then(reg => reg.showNotification(title, opts));
    } else { new Notification(title, opts); }
  }
}
function testNotification() { sendAppNotification('🔔 Tes Engine Aktif', 'Sistem notifikasi aktif.'); }

function switchTab(tabId, title, btn) {
  $('pageTitle').textContent = title;
  document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('active'));
  $('view-' + tabId).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (tabId === 'chart') renderChart();
  if (tabId === 'stats') renderStats();
}

function jsonpGet(qs, validate) {
  return new Promise(resolve => {
    if (!WORKER_URL.startsWith('http')) return resolve(null);
    const name = 'cb_' + Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    const done = val => { try { delete window[name]; } catch(e){} s.remove(); resolve(val); };
    window[name] = d => done(validate(d) ? d : null);
    s.onerror = () => done(null);
    setTimeout(() => done(null), 9000);
    s.src = WORKER_URL + (WORKER_URL.includes('?') ? '&' : '?') + qs + '&callback=' + name;
    document.body.appendChild(s);
  });
}

function emaArr(v, n) {
  const k = 2 / (n + 1);
  let e = v[0];
  const o = [e];
  for (let i = 1; i < v.length; i++) { e = v[i] * k + e * (1 - k); o.push(e); }
  return o;
}

function trSeries(c) {
  const tr = [];
  for (let i = 1; i < c.length; i++) {
    tr.push(Math.max(c[i][2] - c[i][3], Math.abs(c[i][2] - c[i-1][4]), Math.abs(c[i][3] - c[i-1][4])));
  }
  return tr;
}
function atrLast(c, n = 14) {
  const tr = trSeries(c);
  if (tr.length < n) return null;
  let a = tr.slice(0, n).reduce((x,y)=>x+y,0)/n;
  for (let i = n; i < tr.length; i++) a = (a * (n - 1) + tr[i]) / n;
  return a;
}

// Strategi 1: Alchemist SMC + ICT Sweep
function alchemistSMC(m15, atr) {
  const n = m15.length;
  const res = { name: 'Alchemist SMC/ICT', dir: null, score: 0, reasons: [], stopLevel: null };
  if (n < 30) return res;

  const candles = m15.map(x => ({ o: x[1], h: x[2], l: x[3], c: x[4] }));
  const lastC = candles[n - 1];
  const pool = candles.slice(-22, -2);
  const bsl = Math.max(...pool.map(x => x.h));
  const ssl = Math.min(...pool.map(x => x.l));

  if (lastC.l < ssl && lastC.c > ssl) {
    res.dir = 'BUY'; res.score = 85; res.stopLevel = lastC.l - 0.3 * atr;
    res.reasons.push({ ok: true, txt: `Sweep SSL di ${fmtInt(ssl)}` });
    return res;
  }
  if (lastC.h > bsl && lastC.c < bsl) {
    res.dir = 'SELL'; res.score = 85; res.stopLevel = lastC.h + 0.3 * atr;
    res.reasons.push({ ok: true, txt: `Sweep BSL di ${fmtInt(bsl)}` });
    return res;
  }
  res.reasons.push({ ok: false, txt: 'Memindai liquidity sweep' });
  return res;
}

// Strategi 2: Trend Pullback Counter
function trendPullbackCounter(m15, atr) {
  const n = m15.length;
  const res = { name: 'Trend Pullback Counter', dir: null, score: 0, reasons: [], stopLevel: null };
  if (n < 50) return res;

  const closes = m15.map(x => x[4]);
  const e20 = emaArr(closes, 20);
  const e50 = emaArr(closes, 50);
  const lastE20 = e20[n - 1], lastE50 = e50[n - 1];
  const c0 = m15[n - 1], c1 = m15[n - 2];

  if (lastE20 > lastE50 && c0[4] > c0[1] && c0[4] > c1[2]) {
    res.dir = 'BUY'; res.score = 82; res.stopLevel = c0[3] - 0.2 * atr;
    res.reasons.push({ ok: true, txt: 'Uptrend Pullback Counter Bullish' });
    return res;
  }
  if (lastE20 < lastE50 && c0[4] < c0[1] && c0[4] < c1[3]) {
    res.dir = 'SELL'; res.score = 82; res.stopLevel = c0[2] + 0.2 * atr;
    res.reasons.push({ ok: true, txt: 'Downtrend Pullback Counter Bearish' });
    return res;
  }
  res.reasons.push({ ok: false, txt: 'Memindai pullback tren' });
  return res;
}

function runAnalysis() {
  const cd = state.candles;
  if (!cd || !cd.m15 || cd.m15.length < 50) return;
  const m15 = cd.m15.slice(0, -1);
  const atr = atrLast(m15, 14);
  if (!atr) return;

  const smcRes = alchemistSMC(m15, atr);
  const pbRes = trendPullbackCounter(m15, atr);
  state.analysis = { atr, strats: [smcRes, pbRes], cT: cd.m15[cd.m15.length - 1][0] };
  renderEngineUI();
  checkAutoSignal();
}

function checkAutoSignal() {
  const a = state.analysis;
  if (!liveOk || !a) return;

  // Langsung eksekusi sinyal yang memenuhi skor tanpa ada penahanan No Trade
  const valid = a.strats.filter(s => s.dir && s.score >= state.thr);
  if (!valid.length) return;

  valid.forEach(best => {
    const exists = state.signals.some(s => s.status === 'ACTIVE' && s.strat === best.name && s.cT === a.cT);
    if (exists) return;

    const entry = state.price;
    const isBuy = best.dir === 'BUY';
    let sl = isBuy ? (best.stopLevel < entry ? best.stopLevel : entry - a.atr) : (best.stopLevel > entry ? best.stopLevel : entry + a.atr);
    let risk = Math.abs(entry - sl);
    if (risk <= 0.2) return;

    const newSig = {
      id: 'SIG_' + Date.now() + '_' + Math.floor(Math.random()*100),
      pair: 'XAUUSD', tf: 'M15',
      dir: best.dir, strat: best.name, score: best.score, rr: '1:3.5',
      entry: +entry.toFixed(2), sl: +sl.toFixed(2),
      tp1: +(isBuy ? entry + risk*1.0 : entry - risk*1.0).toFixed(2),
      tp2: +(isBuy ? entry + risk*2.0 : entry - risk*2.0).toFixed(2),
      tp3: +(isBuy ? entry + risk*3.5 : entry - risk*3.5).toFixed(2),
      slPips: Math.round(risk * 10), tp1Pips: Math.round(risk * 10),
      tp2Pips: Math.round(risk * 20), tp3Pips: Math.round(risk * 35),
      tp1Hit: false, tp2Hit: false, tp3Hit: false,
      status: 'ACTIVE', createdAt: Date.now(), cT: a.cT, reasons: best.reasons
    };

    state.signals.unshift(newSig);
    saveSignals();
    renderSignals();
    sendAppNotification(`🚨 Sinyal ${newSig.strat} ${newSig.dir}`, `Entry: ${fmtInt(newSig.entry)} | SL: ${fmtInt(newSig.sl)}`);
  });
}

function monitorSignals() {
  if (!liveOk) return;
  let changed = false;
  const p = state.price;
  state.signals.forEach(s => {
    if (s.status !== 'ACTIVE') return;
    const isBuy = s.dir === 'BUY';
    if (!s.tp1Hit && (isBuy ? p >= s.tp1 : p <= s.tp1)) { s.tp1Hit = true; s.sl = s.entry; s.beMoved = true; changed = true; }
    if (!s.tp2Hit && (isBuy ? p >= s.tp2 : p <= s.tp2)) { s.tp2Hit = true; changed = true; }
    if (!s.tp3Hit && (isBuy ? p >= s.tp3 : p <= s.tp3)) { s.tp3Hit = true; s.status = 'WON'; changed = true; }
    if (s.status === 'ACTIVE' && (isBuy ? p <= s.sl : p >= s.sl)) {
      s.status = s.tp1Hit ? 'WON' : 'LOSS'; changed = true;
    }
  });
  if (changed) { saveSignals(); renderSignals(); }
}

function renderSignals() {
  const list = $('signalsList');
  $('activeBadge').textContent = state.signals.filter(s => s.status === 'ACTIVE').length;
  if (!state.signals.length) {
    list.innerHTML = `<div class="sig-card" style="text-align:center;padding:28px"><div style="font-size:24px;margin-bottom:8px">⚡</div><b>Mesin Sinyal Aktif</b><div style="font-size:12px;color:var(--muted);margin-top:4px">Memindai peluang market secara real-time.</div></div>`;
    return;
  }
  list.innerHTML = state.signals.map((s, idx) => {
    const isBuy = s.dir === 'BUY';
    return `
    <div class="sig-card">
      <div class="sig-head">
        <div class="sig-pair-wrap"><div class="gold-icon">Au</div><span class="sig-pair">XAUUSD</span><span class="dir-pill ${isBuy?'buy':'sell'}">${isBuy?'↗ BUY':'↘ SELL'}</span><span class="rr-pill">${s.rr}</span></div>
        <span class="sig-status ${s.status.toLowerCase()}">● ${s.status}</span>
      </div>
      <div class="grid-3">
        <div class="lvl-box"><div class="lvl-lbl">ENTRY</div><div class="lvl-val">${fmtInt(s.entry)}</div></div>
        <div class="lvl-box sl"><div class="lvl-lbl">SL · ${s.slPips}p</div><div class="lvl-val">${fmtInt(s.sl)}</div></div>
        <div class="lvl-box ${s.tp1Hit?'tp-hit':''}"><div class="lvl-lbl">TP1 · ${s.tp1Pips}p</div><div class="lvl-val">${fmtInt(s.tp1)}</div></div>
      </div>
      <div class="sig-foot">
        <span>${s.strat} (Skor ${s.score}%)</span>
        <div class="foot-actions"><button class="foot-btn" onclick="openDetails(${idx})">Details ›</button></div>
      </div>
    </div>`;
  }).join('');
}

function openDetails(idx) {
  const s = state.signals[idx]; if (!s) return;
  $('modalTitle').textContent = `${s.dir} · ${s.strat}`;
  $('modalBody').innerHTML = (s.reasons || []).map(r => `<div style="margin-bottom:6px;color:${r.ok?'var(--green)':'var(--muted)'}">${r.ok?'✓':'•'} ${r.txt}</div>`).join('');
  $('detailModal').classList.add('open');
}
function closeModal() { $('detailModal').classList.remove('open'); }

function renderChart() {
  const svg = $('chartSvg'), W = 320, H = 200, N = 24;
  let candles = (state.candles?.m15?.length >= N) ? state.candles.m15.slice(-N).map(x=>({o:x[1],h:x[2],l:x[3],c:x[4]})) : state.hist.slice(-N).map(v=>({o:v,c:v,h:v+1,l:v-1}));
  const activeSig = state.signals.find(s => s.status === 'ACTIVE') || state.signals[0];
  const allVals = [...candles.flatMap(c=>[c.h,c.l]), ...(activeSig?[activeSig.sl,activeSig.tp1,activeSig.entry]:[])];
  const mn = Math.min(...allVals), mx = Math.max(...allVals), pad = ((mx-mn)*0.1)||1;
  const Y = v => 14 + (H-28)*(1-((v - (mn-pad))/((mx+pad)-(mn-pad))));
  const cw = W/candles.length, bw = cw*0.56;
  let out = '';
  if (activeSig) {
    [[activeSig.tp1,'#10b981','TP1'],[activeSig.entry,'#f59e0b','ENTRY'],[activeSig.sl,'#ef4444','SL']].forEach(([v,col,lbl])=>{
      out += `<line x1="0" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="${col}" stroke-width="1" stroke-dasharray="4 3"/>`;
      out += `<text x="${W-6}" y="${Y(v)-3}" fill="${col}" font-size="8" text-anchor="end">${lbl} ${fmtInt(v)}</text>`;
    });
  }
  candles.forEach((c, i)=>{
    const x = i*cw + cw/2, up = c.c >= c.o, col = up ? '#10b981' : '#ef4444';
    out += `<line x1="${x}" x2="${x}" y1="${Y(c.h)}" y2="${Y(c.l)}" stroke="${col}" stroke-width="1"/>`;
    out += `<rect x="${x-bw/2}" y="${Math.min(Y(c.o),Y(c.c))}" width="${bw}" height="${Math.max(Math.abs(Y(c.c)-Y(c.o)),1.5)}" fill="${col}" rx="1"/>`;
  });
  svg.innerHTML = out;
  $('activePlanBox').innerHTML = activeSig ? `<div class="panel-title">Setup Aktif (${activeSig.dir})</div><div class="row-item"><span>Entry</span><b>${fmt(activeSig.entry)}</b></div><div class="row-item"><span>SL</span><b style="color:var(--red)">${fmt(activeSig.sl)}</b></div>` : '<div style="font-size:12px;color:var(--muted)">Tidak ada setup aktif.</div>';
}

function renderEngineUI() {
  const a = state.analysis;
  if (!a) return;
  $('engineRules').innerHTML = a.strats.map(st => `
    <div class="row-item">
      <div><b>${st.name}</b><div style="font-size:11px;color:var(--muted)">${st.dir||'Scanning...'}</div></div>
      <span class="dir-pill ${st.dir?'buy':''}">Skor ${st.score}%</span>
    </div>`).join('');
}
function forceScan() { refreshCandles(); }
function clearHistory() { if(confirm('Reset riwayat?')) { state.signals=[]; saveSignals(); renderSignals(); } }

async function pollPrice() {
  const prev = state.price;
  const d = await jsonpGet('', res => res && isFinite(Number(res.price)) && Number(res.price) > 0);
  if (d) { state.price = Number(d.price); liveOk = true; $('connDot').classList.remove('sim'); $('connText').textContent = 'MT5 LIVE'; }
  else { state.price += (Math.random()-0.5)*2; liveOk = false; $('connDot').classList.add('sim'); $('connText').textContent = 'SIMULASI'; }
  state.hist.push(state.price); if (state.hist.length>60) state.hist.shift();
  $('livePrice').textContent = fmt(state.price);
  const diff = state.price - prev;
  $('priceChg').textContent = `${diff>=0?'▲':'▼'} ${fmt(Math.abs(diff))}`;
  $('priceChg').style.color = diff>=0?'var(--green)':'var(--red)';
  monitorSignals();
}

async function refreshCandles() {
  const cd = await jsonpGet('candles=1', d => d && d.m15);
  if (cd) { state.candles = cd; runAnalysis(); }
}

for (let i = 0; i < 30; i++) state.hist.push(state.price + (Math.random()-0.5)*4);
updateNotifUI(); renderSignals(); renderEngineUI();
pollPrice().then(refreshCandles);
setInterval(pollPrice, POLL_MS);
setInterval(refreshCandles, CANDLE_POLL_MS);
</script>
</body>
</html>
