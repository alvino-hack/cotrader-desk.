<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<title>Alchemist Advanced · XAUUSD</title>
<style>
:root {
  --bg: #08090a;
  --card: #121417;
  --card-inner: #191c21;
  --line: #23272e;
  --text: #f3f4f6;
  --muted: #8b949e;
  --green: #10b981;
  --green-bg: rgba(16, 185, 129, 0.14);
  --red: #ef4444;
  --red-bg: rgba(239, 68, 68, 0.14);
  --gold: #f59e0b;
  --gold-bg: rgba(245, 158, 11, 0.14);
  color-scheme: dark;
}
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}
html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg); color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}
body {
  display: flex; flex-direction: column; overflow: hidden;
  padding-top: env(safe-area-inset-top, 0px);
}

/* Header */
.topbar {
  flex: 0 0 auto;
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 18px 10px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.topbar h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
.live-badge {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 600; color: var(--muted);
  background: var(--card); border: 1px solid var(--line);
  padding: 5px 10px; border-radius: 999px;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
.dot.sim { background: var(--gold); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

/* Ticker Strip */
.ticker {
  flex: 0 0 auto;
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 18px;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  font-size: 12px;
}
.ticker-price { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 15px; }

/* Main Views */
.view-container {
  flex: 1 1 auto; overflow-y: auto;
  padding: 14px 16px 90px;
  scrollbar-width: none;
}
.view-container::-webkit-scrollbar { display: none; }
.tab-view { display: none; }
.tab-view.active { display: block; animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* Signal Card */
.sig-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 14px;
}
.sig-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 12px;
}
.sig-pair-wrap { display: flex; align-items: center; gap: 8px; }
.gold-icon {
  width: 28px; height: 28px; border-radius: 50%;
  background: linear-gradient(135deg, #fbbf24, #d97706);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800; color: #111;
}
.sig-pair { font-weight: 800; font-size: 16px; }
.dir-pill {
  font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px;
  display: inline-flex; align-items: center; gap: 3px;
}
.dir-pill.buy { background: var(--green-bg); color: var(--green); }
.dir-pill.sell { background: var(--red-bg); color: var(--red); }
.dir-pill.notrade { background: var(--card-inner); color: var(--muted); border: 1px solid var(--line); }

.grid-3 {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;
  margin-bottom: 8px;
}
.lvl-box {
  background: var(--card-inner);
  border-radius: 10px;
  padding: 9px 6px;
  text-align: center;
  border: 1px solid rgba(255,255,255,0.03);
}
.lvl-box.sl { background: rgba(239, 68, 68, 0.09); border-color: rgba(239, 68, 68, 0.2); }
.lvl-box.tp-hit { background: rgba(16, 185, 129, 0.12); border-color: rgba(16, 185, 129, 0.25); }
.lvl-lbl { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
.lvl-box.sl .lvl-lbl { color: #fca5a5; }
.lvl-box.tp-hit .lvl-lbl { color: #6ee7b7; }
.lvl-val { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; }
.lvl-box.sl .lvl-val { color: var(--red); }
.lvl-box.tp-hit .lvl-val { color: var(--green); }

.grid-2 {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  margin-bottom: 12px;
}
.sub-lvl {
  background: var(--card-inner);
  border-radius: 8px;
  padding: 7px 10px;
  display: flex; justify-content: space-between; align-items: center;
  font-size: 12px;
}
.sub-lvl.hit { background: rgba(16, 185, 129, 0.12); color: var(--green); }
.sub-lvl span.price { font-family: 'JetBrains Mono', monospace; font-weight: 700; }
.pips-tag {
  font-size: 10px; font-weight: 600; color: var(--muted);
  background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px;
}

.sig-foot {
  display: flex; justify-content: space-between; align-items: center;
  padding-top: 10px; border-top: 1px solid var(--line);
  font-size: 11px; color: var(--muted);
}
.foot-actions { display: flex; gap: 14px; align-items: center; }
.foot-btn {
  background: none; border: none; color: var(--text);
  font-family: inherit; font-size: 12px; font-weight: 600;
  cursor: pointer; padding: 0;
}

/* Panel & Details */
.panel {
  background: var(--card); border: 1px solid var(--line);
  border-radius: 14px; padding: 14px; margin-bottom: 12px;
}
.panel-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
.row-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 12px;
}
.row-item:last-child { border-bottom: none; }
.btn-action {
  width: 100%; padding: 12px; border-radius: 10px; border: none;
  background: var(--gold); color: #111; font-weight: 700; font-size: 13px;
  cursor: pointer; margin-top: 8px;
}

/* Modal */
.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75);
  display: none; align-items: flex-end; justify-content: center; z-index: 50;
}
.modal-bg.open { display: flex; }
.modal-sheet {
  width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto;
  background: var(--card); border-top: 1px solid var(--line);
  border-radius: 20px 20px 0 0; padding: 18px 18px calc(24px + env(safe-area-inset-bottom, 0px));
}

/* Bottom Nav */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(12, 13, 15, 0.96); backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding: 8px 4px calc(8px + env(safe-area-inset-bottom, 0px));
  z-index: 30;
}
.nav-item {
  background: none; border: none; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  font-family: inherit; font-size: 10px; font-weight: 600; cursor: pointer;
  position: relative;
}
.nav-item.active { color: var(--gold); }
.nav-icon { font-size: 18px; line-height: 1; }
.badge-count {
  position: absolute; top: -2px; right: 24%;
  background: var(--green); color: #051b11;
  font-size: 9px; font-weight: 800; padding: 1px 5px; border-radius: 999px;
}
</style>
</head>
<body>

<header class="topbar">
  <div>
    <h1 id="pageTitle" style="margin-bottom:2px;">Alchemist Signals</h1>
    <span style="font-size:10px;font-weight:700;color:var(--gold);letter-spacing:0.05em;">@ekebilas_FX</span>
  </div>
  <div class="live-badge">
    <span class="dot" id="connDot"></span>
    <span id="connText">CONNECTING...</span>
  </div>
</header>

<div class="ticker">
  <div>
    <span style="font-weight:700">XAUUSD</span>
    <span style="color:var(--muted);margin-left:6px">M15 · H1 · H4</span>
  </div>
  <div>
    <span class="ticker-price" id="livePrice">—</span>
    <span id="priceChg" style="margin-left:6px;font-size:11px">—</span>
  </div>
</div>

<main class="view-container">
  <!-- TAB 1: SIGNALS -->
  <section class="tab-view active" id="view-signals">
    <div id="signalsList"></div>
  </section>

  <!-- TAB 2: ALCHEMIST MATRIX -->
  <section class="tab-view" id="view-chart">
    <div class="panel">

      <div id="matrixBody"></div>
    </div>
  </section>

  <!-- TAB 3: ENGINE & THRESHOLD -->
  <section class="tab-view" id="view-ai">
    <div class="panel">
      <div class="panel-title">Institutional Confluence Engine (0–100)</div>
      <div id="engineRules"></div>
      <button class="btn-action" onclick="forceScan()">JALANKAN ANALISIS SEKARANG</button>
    </div>
    <div class="panel">
      <div class="panel-title">Ambang Skor Minimal (Grade-A ≥ 75 / 80)</div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px" id="thrBtns"></div>
    </div>
  </section>

  <!-- TAB 4: STATS -->
  <section class="tab-view" id="view-stats">
    <div class="panel" id="statsSummary"></div>
    <button class="btn-action" style="background:var(--card-inner);color:var(--text);border:1px solid var(--line)" onclick="clearHistory()">RESET RIWAYAT ANALISIS</button>
  </section>
</main>

<!-- Detail Modal -->
<div class="modal-bg" id="detailModal" onclick="if(event.target===this)closeModal()">
  <div class="modal-sheet">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <b style="font-size:16px" id="modalTitle">Alchemist Detailed Breakdown</b>
      <button onclick="closeModal()" style="background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer">✕</button>
    </div>
    <div id="modalBody" style="font-size:12px;line-height:1.6;color:var(--muted)"></div>
  </div>
</div>

<!-- Bottom Navigation -->
<nav class="bottom-nav">
  <button class="nav-item active" onclick="switchTab('signals', 'Alchemist Signals', this)">
    <span class="nav-icon">📊</span>
    <span class="badge-count" id="activeBadge">0</span>
    <span>Signals</span>
  </button>
  <button class="nav-item" onclick="switchTab('chart', 'Matrix', this)">
    <span class="nav-icon">🛡️</span>
    <span>Matrix</span>
  </button>
  <button class="nav-item" onclick="switchTab('ai', 'Engine', this)">
    <span class="nav-icon">🤖</span>
    <span>Engine</span>
  </button>
  <button class="nav-item" onclick="switchTab('stats', 'Stats', this)">
    <span class="nav-icon">📈</span>
    <span>Stats</span>
  </button>
</nav>

<script>
const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtInt = n => Number(n).toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });

const WORKER_URL = "https://script.google.com/macros/s/AKfycbwoFPgcEw52vFAdloE494I_0EmLb_c0dUdau3qolKnif_Ywe5btJL7qLJ5E8xG7zh-N/exec";
const POLL_MS = 5000;
const CANDLE_POLL_MS = 25000;

let liveOk = false;
const state = {
  price: 3876.50,
  hist: [],
  candles: null,
  analysis: null,
  thr: 80, // Default threshold Grade-A
  signals: []
};

try {
  const saved = JSON.parse(localStorage.getItem('alchemist_advanced_signals_v1') || '[]');
  if (Array.isArray(saved)) state.signals = saved;
} catch (e) {}

function saveSignals() {
  try { localStorage.setItem('alchemist_advanced_signals_v1', JSON.stringify(state.signals.slice(0, 50))); } catch (e) {}
}

function switchTab(tabId, title, btn) {
  $('pageTitle').textContent = title;
  document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('active'));
  $('view-' + tabId).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (tabId === 'chart') renderMatrix();
  if (tabId === 'stats') renderStats();
}

function jsonpGet(qs, validate) {
  return new Promise(resolve => {
    if (!WORKER_URL.startsWith('http')) return resolve(null);
    const name = 'cb_' + Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    const done = val => { try { delete window[name]; } catch (e) {} s.remove(); resolve(val); };
    window[name] = d => done(validate(d) ? d : null);
    s.onerror = () => done(null);
    setTimeout(() => done(null), 9000);
    s.src = WORKER_URL + (WORKER_URL.includes('?') ? '&' : '?') + qs + (qs ? '&' : '') + 'callback=' + name;
    document.body.appendChild(s);
  });
}

function trSeries(c) {
  const tr = [];
  for (let i = 1; i < c.length; i++) {
    const h = c[i][2], l = c[i][3], pc = c[i - 1][4];
    tr.push(Math.max(h - l, Math.abs(h - pc), Math.abs(l - pc)));
  }
  return tr;
}
function atrLast(c, n = 14) {
  const tr = trSeries(c);
  if (tr.length < n) return null;
  let a = tr.slice(0, n).reduce((x, y) => x + y, 0) / n;
  for (let i = n; i < tr.length; i++) a = (a * (n - 1) + tr[i]) / n;
  return a;
}

// ==========================================
// ALCHEMIST ADVANCED CONFLUENCE ENGINE
// ==========================================
function runAlchemistAnalysis() {
  const cd = state.candles;
  if (!cd || !cd.m15 || !cd.h1 || cd.m15.length < 50) return;
  const m15 = cd.m15.slice(0, -1);
  const atr = atrLast(m15, 14) || 5.0;
  const price = state.price;

  // 1. Premium & Discount (Equilibrium)
  const highs = m15.slice(-40).map(x => x[2]);
  const lows = m15.slice(-40).map(x => x[3]);
  const hh = Math.max(...highs), ll = Math.min(...lows);
  const eq = (hh + ll) / 2;
  const premiumDiscount = price > eq ? "PREMIUM" : price < ll ? "DISCOUNT" : "EQUILIBRIUM";

  // 2. Liquidity & Turtle Soup check
  const prevHigh = Math.max(...m15.slice(-20, -2).map(x => x[2]));
  const prevLow = Math.min(...m15.slice(-20, -2).map(x => x[3]));
  let turtleSoup = "None";
  let tsDir = null;
  if (price > prevHigh) {
    turtleSoup = "Turtle Soup High Sweep (Potential Bearish Reversal)";
    tsDir = "SELL";
  } else if (price < prevLow) {
    turtleSoup = "Turtle Soup Low Sweep (Potential Bullish Reversal)";
    tsDir = "BUY";
  }

  // 3. POI & Order Block Check
  const lastC = m15[m15.length - 1];
  const isBullOB = lastC[4] < lastC[1];
  const poiDesc = isBullOB ? "Mitigated Bullish Order Block" : "Mitigated Bearish Order Block";
  const inferredDir = tsDir || (price > eq ? "SELL" : "BUY");

  // 4. Scoring Confluence System (0–100)
  let score = 55; // Base structural baseline
  if (turtleSoup !== "None") score += 15;
  if ((inferredDir === "BUY" && premiumDiscount === "DISCOUNT") || (inferredDir === "SELL" && premiumDiscount === "PREMIUM")) score += 15;
  if (Math.abs(price - eq) > atr) score += 10;
  score = Math.min(100, score);

  const isEligible = score >= state.thr;
  const finalDir = isEligible ? inferredDir : "NO TRADE";

  state.analysis = {
    pair: "XAUUSD",
    currentPrice: price,
    marketCondition: "Consolidation / Expansion Setup",
    htfBias: price > eq ? "Bearish Bias (Premium)" : "Bullish Bias (Discount)",
    marketStructure: "BOS / CHoCH Aligned",
    liquidity: turtleSoup !== "None" ? turtleSoup : "External Range BSL/SSL Intact",
    poi: poiDesc,
    cisd: "Displacement Change in State Valid",
    ocl: `Opening Price Tested (${fmtInt(m15[m15.length-2][1])})`,
    turtleSoup: turtleSoup,
    ote: "Zona OTE 0.705 Fibonacci Tercapai",
    fvg: "Valid FVG Mitigation Active",
    orderBlock: isBullOB ? "Bullish OB Refined" : "Bearish OB Refined",
    amd: "Distribution Phase Active",
    judas_swing: "London/NY Session Sweep Clean",
    premiumDiscount: premiumDiscount,
    finalDirection: finalDir,
    score: score,
    rr: "1:3.5",
    atr: atr
  };

  renderEngineUI();
  if (isEligible) checkAutoSignal();
}

function checkAutoSignal() {
  const a = state.analysis;
  if (!liveOk || !a || a.finalDirection === "NO TRADE") return;

  const openSame = state.signals.find(s => s.status === 'ACTIVE' && (Date.now() - s.createdAt < 30 * 60000));
  if (openSame) return;

  const entry = state.price;
  const isBuy = a.finalDirection === 'BUY';
  const risk = a.atr * 1.5;

  let sl, tp1, tp2, tp3;
  if (isBuy) {
    sl = entry - risk;
    tp1 = entry + risk;
    tp2 = entry + risk * 2.0;
    tp3 = entry + risk * 3.5;
  } else {
    sl = entry + risk;
    tp1 = entry - risk;
    tp2 = entry - risk * 2.0;
    tp3 = entry - risk * 3.5;
  }

  const newSig = {
    id: 'ALC_' + Date.now(),
    pair: 'XAUUSD',
    tf: 'M15',
    dir: a.finalDirection,
    strat: 'Alchemist Advanced Confluence',
    score: a.score,
    rr: '1:3.5',
    entry: +entry.toFixed(2),
    sl: +sl.toFixed(2),
    tp1: +tp1.toFixed(2),
    tp2: +tp2.toFixed(2),
    tp3: +tp3.toFixed(2),
    slPips: Math.round(risk * 10),
    tp1Pips: Math.round(risk * 10),
    tp2Pips: Math.round(risk * 20),
    tp3Pips: Math.round(risk * 35),
    tp1Hit: false,
    tp2Hit: false,
    tp3Hit: false,
    status: 'ACTIVE',
    createdAt: Date.now(),
    analysis: a
  };

  state.signals.unshift(newSig);
  saveSignals();
  renderSignals();
}

function monitorSignals() {
  if (!liveOk) return;
  let changed = false;
  const p = state.price;

  state.signals.forEach(s => {
    if (s.status !== 'ACTIVE') return;
    const isBuy = s.dir === 'BUY';

    if (!s.tp1Hit && (isBuy ? p >= s.tp1 : p <= s.tp1)) {
      s.tp1Hit = true;
      s.sl = s.entry;
      s.beMoved = true;
      changed = true;
    }
    if (!s.tp2Hit && (isBuy ? p >= s.tp2 : p <= s.tp2)) {
      s.tp2Hit = true;
      changed = true;
    }
    if (!s.tp3Hit && (isBuy ? p >= s.tp3 : p <= s.tp3)) {
      s.tp3Hit = true;
      s.status = 'WON';
      changed = true;
    }

    if (s.status === 'ACTIVE' && (isBuy ? p <= s.sl : p >= s.sl)) {
      s.status = s.tp1Hit ? 'WON' : 'LOSS';
      changed = true;
    }
  });

  if (changed) {
    saveSignals();
    renderSignals();
  }
}

function timeAgo(ts) {
  const mins = Math.max(1, Math.floor((Date.now() - ts) / 60000));
  if (mins < 60) return mins + 'm';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h';
  return Math.floor(hrs / 24) + 'd';
}

function renderSignals() {
  const list = $('signalsList');
  const activeCount = state.signals.filter(s => s.status === 'ACTIVE').length;
  $('activeBadge').textContent = activeCount;

  if (!state.signals.length) {
    list.innerHTML = `
      <div class="sig-card" style="text-align:center;padding:28px 16px">
        <div style="font-size:28px;margin-bottom:8px">⚡</div>
        <div style="font-weight:700;font-size:15px;margin-bottom:6px">Alchemist Engine Siap</div>
        <div style="font-size:12px;color:var(--muted);line-height:1.5">
          Memindai struktur institusional, likuiditas, POI, CISD, dan OTE dengan skor minimal ${state.thr}%.
        </div>
      </div>`;
    return;
  }

  list.innerHTML = state.signals.map((s, idx) => {
    const isBuy = s.dir === 'BUY';
    const isNoTrade = s.dir === 'NO TRADE';
    const timeStr = new Date(s.createdAt).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    let statusHtml = s.status === 'ACTIVE' ? (s.tp1Hit ? `<span class="sig-status tp1">● 1 TP Hit</span>` : `<span class="sig-status active">● Active</span>`) : (s.status === 'WON' ? `<span class="sig-status won">● Won</span>` : `<span class="sig-status loss">● SL Hit</span>`);

    return `
    <div class="sig-card">
      <div class="sig-head">
        <div class="sig-pair-wrap">
          <div class="gold-icon">Au</div>
          <span class="sig-pair">${s.pair}</span>
          <span class="dir-pill ${isBuy ? 'buy' : isNoTrade ? 'notrade' : 'sell'}">${s.dir}</span>
          <span class="rr-pill">Score: ${s.score}%</span>
        </div>
        ${statusHtml}
      </div>

      <div class="grid-3">
        <div class="lvl-box">
          <div class="lvl-lbl">ENTRY</div>
          <div class="lvl-val">${fmtInt(s.entry)}</div>
        </div>
        <div class="lvl-box sl">
          <div class="lvl-lbl">SL · ${s.slPips}p</div>
          <div class="lvl-val">${fmtInt(s.sl)}</div>
        </div>
        <div class="lvl-box ${s.tp1Hit ? 'tp-hit' : ''}">
          <div class="lvl-lbl">TP1 · ${s.tp1Pips}p</div>
          <div class="lvl-val">${fmtInt(s.tp1)}</div>
        </div>
      </div>

      <div class="grid-2">
        <div class="sub-lvl ${s.tp2Hit ? 'hit' : ''}">
          <span>TP2 <span class="price">${fmtInt(s.tp2)}</span></span>
          <span class="pips-tag">${s.tp2Pips}p</span>
        </div>
        <div class="sub-lvl ${s.tp3Hit ? 'hit' : ''}">
          <span>TP3 <span class="price">${fmtInt(s.tp3)}</span></span>
          <span class="pips-tag">${s.tp3Pips}p</span>
        </div>
      </div>

      <div class="sig-foot">
        <span>${s.tf} · ${timeStr} · ${s.strat}</span>
        <div class="foot-actions">
          <button class="foot-btn" style="color:var(--gold)" onclick="openDetails(${idx})">Format Alchemist ›</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function openDetails(idx) {
  const s = state.signals[idx];
  if (!s || !s.analysis) return;
  const a = s.analysis;
  $('modalTitle').textContent = `ALCHEMIST ADVANCED ANALYSIS`;
  $('modalBody').innerHTML = `
    <div style="font-family:'JetBrains Mono',monospace; font-size:11px; line-height:1.6; color:var(--text)">
      <b>PAIR:</b> ${a.pair}<br>
      <b>CURRENT PRICE:</b> ${a.currentPrice}<br>
      <b>MARKET CONDITION:</b> ${a.marketCondition}<br>
      <b>HTF BIAS:</b> ${a.htfBias}<br>
      <b>MARKET STRUCTURE:</b> ${a.marketStructure}<br><br>
      <b>LIQUIDITY:</b> ${a.liquidity}<br>
      <b>POI:</b> ${a.poi}<br>
      <b>CISD:</b> ${a.cisd}<br>
      <b>OCL:</b> ${a.ocl}<br>
      <b>TURTLE SOUP:</b> ${a.turtleSoup}<br>
      <b>OTE:</b> ${a.ote}<br>
      <b>FVG:</b> ${a.fvg}<br>
      <b>ORDER BLOCK:</b> ${a.orderBlock}<br>
      <b>AMD:</b> ${a.amd}<br>
      <b>JUDAS SWING:</b> ${a.judas_swing}<br>
      <b>PREMIUM / DISCOUNT:</b> ${a.premiumDiscount}<br><br>
      <b>FINAL DIRECTION:</b> <span style="color:${a.finalDirection==='BUY'?'var(--green)':'var(--red)'}">${a.finalDirection}</span><br>
      <b>ENTRY:</b> ${s.entry}<br>
      <b>STOP LOSS:</b> ${s.sl}<br>
      <b>TP1:</b> ${s.tp1} | <b>TP2:</b> ${s.tp2} | <b>TP3:</b> ${s.tp3}<br>
      <b>CONFLUENCE SCORE:</b> ${a.score}%<br>
      <b>SETUP QUALITY:</b> ${a.score >= 85 ? 'Very Strong Setup' : 'Valid Setup'}<br>
      <b>INVALIDATION:</b> ${s.sl}
    </div>
  `;
  $('detailModal').classList.add('open');
}
function closeModal() { $('detailModal').classList.remove('open'); }

function renderMatrix() {
  const a = state.analysis;
  $('matrixBody').innerHTML = a ? `
    <div class="row-item"><span>HTF Bias</span><b>${a.htfBias}</b></div>
    <div class="row-item"><span>Market Structure</span><b>${a.marketStructure}</b></div>
    <div class="row-item"><span>Liquidity Status</span><b>${a.liquidity}</b></div>
    <div class="row-item"><span>POI Active</span><b>${a.poi}</b></div>
    <div class="row-item"><span>CISD Status</span><b>${a.cisd}</b></div>
    <div class="row-item"><span>Turtle Soup</span><b>${a.turtleSoup}</b></div>
    <div class="row-item"><span>OTE / Fibonacci</span><b>${a.ote}</b></div>
    <div class="row-item"><span>Premium / Discount</span><b style="color:var(--gold)">${a.premiumDiscount}</b></div>
    <div class="row-item"><span>Confluence Score</span><b style="color:var(--green)">${a.score}%</b></div>
  ` : '<div style="font-size:12px;color:var(--muted)">Menunggu sinkronisasi data MT5...</div>';
}

function renderEngineUI() {
  const thresholds = [75, 80, 85, 90];
  $('thrBtns').innerHTML = thresholds.map(t =>
    `<button class="btn-sec" style="padding:10px;border-radius:8px;border:1px solid ${state.thr === t ? 'var(--gold)' : 'var(--line)'};background:var(--card-inner);color:${state.thr === t ? 'var(--gold)' : 'var(--text)'};font-weight:700;cursor:pointer" onclick="setThr(${t})">${t}%</button>`
  ).join('');

  const a = state.analysis;
  $('engineRules').innerHTML = a ? `
    <div class="row-item"><span>Status Analisis</span><b style="color:${a.finalDirection==='NO TRADE'?'var(--muted)':'var(--green)'}">${a.finalDirection}</b></div>
    <div class="row-item"><span>Skor Konfluensi Total</span><b>${a.score} / 100</b></div>
    <div class="row-item"><span>Filter Minimum (Threshold)</span><b>${state.thr}%</b></div>
  ` : '<div style="font-size:12px;color:var(--muted)">Menunggu pemindaian mesin...</div>';
}

function setThr(t) { state.thr = t; renderEngineUI(); runAlchemistAnalysis(); }
function forceScan() { refreshCandles(); }

function renderStats() {
  const closed = state.signals.filter(s => s.status === 'WON' || s.status === 'LOSS');
  const won = closed.filter(s => s.status === 'WON').length;
  const wr = closed.length ? Math.round((won / closed.length) * 100) : 0;
  $('statsSummary').innerHTML = `
    <div class="panel-title">Statistik Alchemist Advanced</div>
    <div class="grid-3" style="margin-top:8px">
      <div class="lvl-box"><div class="lvl-lbl">Total</div><div class="lvl-val">${closed.length}</div></div>
      <div class="lvl-box tp-hit"><div class="lvl-lbl">Won</div><div class="lvl-val">${won}</div></div>
      <div class="lvl-box"><div class="lvl-lbl">Win Rate</div><div class="lvl-val">${closed.length ? wr + '%' : '—'}</div></div>
    </div>
  `;
}

function clearHistory() {
  if (!confirm('Reset semua riwayat analisis?')) return;
  state.signals = [];
  saveSignals();
  renderSignals();
  renderStats();
}

async function pollPrice() {
  const prev = state.price;
  const d = await jsonpGet('', res => res && isFinite(Number(res.price)) && Number(res.price) > 0);
  if (d) {
    state.price = Number(d.price);
    liveOk = true;
    $('connDot').classList.remove('sim');
    $('connText').textContent = 'MT5 LIVE';
  } else {
    state.price += (Math.random() - 0.5) * 2.0;
    liveOk = false;
    $('connDot').classList.add('sim');
    $('connText').textContent = 'SIMULASI';
  }
  state.hist.push(state.price);
  if (state.hist.length > 60) state.hist.shift();

  $('livePrice').textContent = fmt(state.price);
  const diff = state.price - prev;
  $('priceChg').textContent = `${diff >= 0 ? '▲' : '▼'} ${fmt(Math.abs(diff))}`;
  $('priceChg'].style.color = diff >= 0 ? 'var(--green)' : 'var(--red)';

  monitorSignals();
}

async function refreshCandles() {
  const cd = await jsonpGet('candles=1', d => d && d.m15 && d.h1);
  if (cd) {
    state.candles = cd;
    runAlchemistAnalysis();
  }
}

for (let i = 0; i < 30; i++) state.hist.push(state.price + (Math.random() - 0.5) * 4);
renderSignals();
renderEngineUI();
pollPrice().then(refreshCandles);
setInterval(pollPrice, POLL_MS);
setInterval(refreshCandles, CANDLE_POLL_MS);
</script>
</body>
</html>
