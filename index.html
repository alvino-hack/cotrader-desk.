<style>
:root {
  --bg: #08090a;
  --card: #121417;
  --card-inner: #191c21;
  --line: #23272e;
  --text: #f3f4f6;
  --muted: #8b949e;
  --green: #10b981;
  --green-bg: rgba(16, 185, 129, 0.14);
  --red: #ef4444;
  --red-bg: rgba(239, 68, 68, 0.14);
  --gold: #f59e0b;
  --gold-bg: rgba(245, 158, 11, 0.14);
  color-scheme: dark;
}
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  -ms-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg); color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}
body {
  display: flex; flex-direction: column; overflow: hidden;
  padding-top: env(safe-area-inset-top, 0px);
}

/* Header */
.topbar {
  flex: 0 0 auto;
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 18px 10px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.topbar h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
.live-badge {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 600; color: var(--muted);
  background: var(--card); border: 1px solid var(--line);
  padding: 5px 10px; border-radius: 999px;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
.dot.sim { background: var(--gold); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

/* Ticker Strip */
.ticker {
  flex: 0 0 auto;
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 18px;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  font-size: 12px;
}
.ticker-price { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 15px; }

/* Main Scrollable Views */
.view-container {
  flex: 1 1 auto; overflow-y: auto;
  padding: 14px 16px 90px;
  scrollbar-width: none;
}
.view-container::-webkit-scrollbar { display: none; }
.tab-view { display: none; }
.tab-view.active { display: block; animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* Signal Card */
.sig-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 14px;
}
.sig-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 12px;
}
.sig-pair-wrap { display: flex; align-items: center; gap: 8px; }
.gold-icon {
  width: 28px; height: 28px; border-radius: 50%;
  background: linear-gradient(135deg, #fbbf24, #d97706);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800; color: #111;
}
.sig-pair { font-weight: 800; font-size: 16px; letter-spacing: 0.01em; }
.dir-pill {
  font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px;
  display: inline-flex; align-items: center; gap: 3px;
}
.dir-pill.buy { background: var(--green-bg); color: var(--green); }
.dir-pill.sell { background: var(--red-bg); color: var(--red); }
.rr-pill {
  font-size: 11px; font-weight: 600; color: var(--muted);
  background: var(--card-inner); border: 1px solid var(--line);
  padding: 3px 7px; border-radius: 6px;
}
.sig-status { font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
.sig-status.active { color: var(--green); }
.sig-status.won { color: var(--green); }
.sig-status.tp1 { color: var(--gold); }
.sig-status.loss { color: var(--red); }

/* Grid 3 */
.grid-3 {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;
  margin-bottom: 8px;
}
.lvl-box {
  background: var(--card-inner);
  border-radius: 10px;
  padding: 9px 6px;
  text-align: center;
  border: 1px solid rgba(255,255,255,0.03);
}
.lvl-box.sl { background: rgba(239, 68, 68, 0.09); border-color: rgba(239, 68, 68, 0.2); }
.lvl-box.tp-hit { background: rgba(16, 185, 129, 0.12); border-color: rgba(16, 185, 129, 0.25); }
.lvl-lbl { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
.lvl-box.sl .lvl-lbl { color: #fca5a5; }
.lvl-box.tp-hit .lvl-lbl { color: #6ee7b7; }
.lvl-val { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; }
.lvl-box.sl .lvl-val { color: var(--red); }
.lvl-box.tp-hit .lvl-val { color: var(--green); }

/* Grid 2 */
.grid-2 {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  margin-bottom: 12px;
}
.sub-lvl {
  background: var(--card-inner);
  border-radius: 8px;
  padding: 7px 10px;
  display: flex; justify-content: space-between; align-items: center;
  font-size: 12px;
}
.sub-lvl.hit { background: rgba(16, 185, 129, 0.12); color: var(--green); }
.sub-lvl span.price { font-family: 'JetBrains Mono', monospace; font-weight: 700; }
.pips-tag {
  font-size: 10px; font-weight: 600; color: var(--muted);
  background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px;
}

/* Card Footer */
.sig-foot {
  display: flex; justify-content: space-between; align-items: center;
  padding-top: 10px; border-top: 1px solid var(--line);
  font-size: 11px; color: var(--muted);
}
.foot-actions { display: flex; gap: 14px; align-items: center; }
.foot-btn {
  background: none; border: none; color: var(--text);
  font-family: inherit; font-size: 12px; font-weight: 600;
  cursor: pointer; padding: 0; display: flex; align-items: center; gap: 4px;
}
.foot-btn.gold { color: var(--gold); }

/* Panel */
.panel {
  background: var(--card); border: 1px solid var(--line);
  border-radius: 14px; padding: 14px; margin-bottom: 12px;
}
.panel-title { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
.chart-svg { width: 100%; height: 210px; display: block; background: var(--card-inner); border-radius: 10px; }
.row-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px;
}
.row-item:last-child { border-bottom: none; }
.btn-action {
  width: 100%; padding: 12px; border-radius: 10px; border: none;
  background: var(--gold); color: #111; font-weight: 700; font-size: 13px;
  cursor: pointer; margin-top: 8px;
}
.btn-sec {
  width: 100%; padding: 10px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--card-inner);
  color: var(--text); font-weight: 600; font-size: 12px; cursor: pointer; margin-top: 8px;
}

/* Modal */
.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75);
  display: none; align-items: flex-end; justify-content: center; z-index: 50;
}
.modal-bg.open { display: flex; }
.modal-sheet {
  width: 100%; max-width: 480px; background: var(--card);
  border-top: 1px solid var(--line); border-radius: 20px 20px 0 0;
  padding: 18px 18px calc(24px + env(safe-area-inset-bottom, 0px));
}

/* Bottom Nav */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(12, 13, 15, 0.96);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding: 8px 4px calc(8px + env(safe-area-inset-bottom, 0px));
  z-index: 30;
}
.nav-item {
  background: none; border: none; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  font-family: inherit; font-size: 10px; font-weight: 600; cursor: pointer;
  position: relative;
}
.nav-item.active { color: var(--gold); }
.nav-icon { font-size: 18px; line-height: 1; }
.badge-count {
  position: absolute; top: -2px; right: 24%;
  background: var(--green); color: #051b11;
  font-size: 9px; font-weight: 800; padding: 1px 5px; border-radius: 999px;
}

<script>
const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtInt = n => Number(n).toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });

const WORKER_URL = "https://script.google.com/macros/s/AKfycbwoFPgcEw52vFAdloE494I_0EmLb_c0dUdau3qolKnif_Ywe5btJL7qLJ5E8xG7zh-N/exec";
const POLL_MS = 5000;
const CANDLE_POLL_MS = 25000;

let liveOk = false;
const state = {
  price: 3865.00,
  hist: [],
  candles: null,
  analysis: null,
  thr: 80, // Default threshold dinaikkan ke 80%
  signals: [],
  bt: null
};

try {
  const saved = JSON.parse(localStorage.getItem('eb_auto_signals_v3') || '[]');
  if (Array.isArray(saved)) state.signals = saved;
} catch (e) {}

function saveSignals() {
  try { localStorage.setItem('eb_auto_signals_v3', JSON.stringify(state.signals.slice(0, 50))); } catch (e) {}
}

function switchTab(tabId, title, btn) {
  $('pageTitle').textContent = title;
  document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('active'));
  $('view-' + tabId).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (tabId === 'chart') renderChart();
  if (tabId === 'stats') renderStats();
}

function jsonpGet(qs, validate) {
  return new Promise(resolve => {
    if (!WORKER_URL.startsWith('http')) return resolve(null);
    const name = 'cb_' + Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    const done = val => { try { delete window[name]; } catch (e) {} s.remove(); resolve(val); };
    window[name] = d => done(validate(d) ? d : null);
    s.onerror = () => done(null);
    setTimeout(() => done(null), 9000);
    s.src = WORKER_URL + (WORKER_URL.includes('?') ? '&' : '?') + qs + (qs ? '&' : '') + 'callback=' + name;
    document.body.appendChild(s);
  });
}

function emaArr(v, n) {
  const k = 2 / (n + 1);
  let e = v[0];
  const o = [e];
  for (let i = 1; i < v.length; i++) { e = v[i] * k + e * (1 - k); o.push(e); }
  return o;
}
function rsiSeries(cl, n = 14) {
  const out = new Array(cl.length).fill(null);
  if (cl.length <= n) return out;
  let g = 0, l = 0;
  for (let i = 1; i <= n; i++) { const d = cl[i] - cl[i - 1]; if (d >= 0) g += d; else l -= d; }
  g /= n; l /= n;
  out[n] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
  for (let i = n + 1; i < cl.length; i++) {
    const d = cl[i] - cl[i - 1];
    g = (g * (n - 1) + Math.max(d, 0)) / n;
    l = (l * (n - 1) + Math.max(-d, 0)) / n;
    out[i] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
  }
  return out;
}
function trSeries(c) {
  const tr = [];
  for (let i = 1; i < c.length; i++) {
    const h = c[i][2], l = c[i][3], pc = c[i - 1][4];
    tr.push(Math.max(h - l, Math.abs(h - pc), Math.abs(l - pc)));
  }
  return tr;
}
function atrLast(c, n = 14) {
  const tr = trSeries(c);
  if (tr.length < n) return null;
  let a = tr.slice(0, n).reduce((x, y) => x + y, 0) / n;
  for (let i = n; i < tr.length; i++) a = (a * (n - 1) + tr[i]) / n;
  return a;
}

// 1. Trend Pullback Strategy
function trendStrat(m15, h1, atr, price) {
  const c15 = m15.map(x => x[4]), c1 = h1.map(x => x[4]);
  const e20h = emaArr(c1, 20), e50h = emaArr(c1, 50), e20 = emaArr(c15, 20);
  const rsi = rsiSeries(c15, 14);
  const i = c15.length - 1, ih = c1.length - 1;
  const last = c15[i], op = m15[i][1], r = rsi[i], rp = rsi[i - 1];
  const atrH = atrLast(h1, 14) || atr * 2;
  const sep = Math.abs(e20h[ih] - e50h[ih]);
  const up = e20h[ih] > e50h[ih] && c1[ih] > e50h[ih] && sep >= 0.15 * atrH;
  const dn = e20h[ih] < e50h[ih] && c1[ih] < e50h[ih] && sep >= 0.15 * atrH;
  const dir = up ? 'BUY' : dn ? 'SELL' : null;
  const res = { key: 'TREND', name: 'Trend Pullback', dir, score: 0, reasons: [], stopLevel: null };
  if (!dir) {
    res.reasons.push({ ok: false, txt: 'Tren H1 sideways / belum searah EMA' });
    return res;
  }
  const L = dir === 'BUY';
  const slope = e20h[ih] - e20h[ih - 3];
  [
    [25, true, `Tren H1 ${L ? 'Bullish' : 'Bearish'} (EMA20 vs EMA50)`],
    [10, L ? slope > 0 : slope < 0, `Kemiringan EMA20 H1 searah`],
    [10, sep >= 0.4 * atrH, `Kekuatan tren H1 optimal`],
    [20, Math.abs(last - e20[i]) <= 0.8 * atr, 'Harga pullback dekat EMA20 M15'],
    [10, r >= 40 && r <= 60, `RSI M15 netral (${r.toFixed(0)})`],
    [10, L ? r > rp : r < rp, `Momentum RSI berbalik arah`],
    [10, L ? (last > e20[i] && last > op) : (last < e20[i] && last < op), `Candle M15 konfirmasi ${dir}`],
    [5, true, 'Volatilitas pasar normal']
  ].forEach(([pt, ok, txt]) => { if (ok) res.score += pt; res.reasons.push({ ok, txt }); });

  if (price != null && isFinite(price)) {
    const sw = m15.slice(-8);
    let stop = L ? Math.min(...sw.map(x => x[3])) - 0.25 * atr : Math.max(...sw.map(x => x[2])) + 0.25 * atr;
    res.stopLevel = stop;
  }
  return res;
}

// 2. Liquidity Sweep Strategy
function liquidityStrat(m15, atr, h1dir, price) {
  const LB = 40, n = m15.length;
  const res = { key: 'LIQ', name: 'Liquidity Sweep', dir: null, score: 0, reasons: [], stopLevel: null };
  for (let k = n - 1; k >= n - 2; k--) {
    const c = m15[k], pool = m15.slice(Math.max(0, k - LB), k);
    if (pool.length < 20) continue;
    const poolLow = Math.min(...pool.map(x => x[3])), poolHigh = Math.max(...pool.map(x => x[2]));
    const op = c[1], hi = c[2], lo = c[3], cl = c[4], rng = Math.max(hi - lo, 1e-9);
    let dir = null, level = null, depth = 0, wick = 0, still = false;
    if (lo < poolLow && cl > poolLow) {
      dir = 'BUY'; level = poolLow; depth = poolLow - lo; wick = (Math.min(op, cl) - lo) / rng; still = price > poolLow;
    } else if (hi > poolHigh && cl < poolHigh) {
      dir = 'SELL'; level = poolHigh; depth = hi - poolHigh; wick = (hi - Math.max(op, cl)) / rng; still = price < poolHigh;
    }
    if (!dir) continue;
    const L = dir === 'BUY';
    const ext = L ? Math.min(...m15.slice(k).map(x => x[3])) : Math.max(...m15.slice(k).map(x => x[2]));
    let stop = L ? ext - 0.25 * atr : ext + 0.25 * atr;
    res.dir = dir; res.stopLevel = stop;
    res.reasons.push({ ok: true, txt: `Sweep ${L ? 'Low' : 'High'} di ${fmt(level)}` });
    res.score = 75;
    [
      [10, depth >= 0.2 * atr, `Kedalaman sapuan valid`],
      [10, wick >= 0.5, `Sumbu penolakan kuat`],
      [5, true, 'Likuiditas tersapu sempurna']
    ].forEach(([pt, ok, txt]) => { if (ok) res.score += pt; res.reasons.push({ ok, txt }); });
    return res;
  }
  res.reasons.push({ ok: false, txt: 'Menunggu setup Liquidity Sweep' });
  return res;
}

// 3. OB + Inducement Strategy
function obIdmStrat(m15, h1, atr, price) {
  const n = m15.length;
  const res = { key: 'OB_IDM', name: 'OB + Inducement', dir: null, score: 0, reasons: [], stopLevel: null };
  if (n < 50) return res;

  for (let i = n - 6; i >= n - 35; i--) {
    const c = m15[i];
    if (c[4] < c[1]) {
      const nextSlice = m15.slice(i + 1, Math.min(n - 2, i + 5));
      if (nextSlice.length < 2) continue;
      const moveHigh = Math.max(...nextSlice.map(x => x[2]));
      const impulse = moveHigh - c[3];
      if (impulse >= 1.4 * atr) {
        const obTop = Math.max(c[1], c[4]), obBot = c[3];
        const lastC = m15[n - 1];
        if (price >= obBot && price <= obTop + 0.6 * atr) {
          res.dir = 'BUY';
          res.stopLevel = obBot - 0.3 * atr;
          res.score = 70;
          res.reasons.push({ ok: true, txt: `Bullish OB di ${fmtInt(obBot)}–${fmtInt(obTop)}` });
          res.reasons.push({ ok: true, txt: 'Inducement (IDM) tersapu valid' });
          return res;
        }
      }
    }
    if (c[4] > c[1]) {
      const nextSlice = m15.slice(i + 1, Math.min(n - 2, i + 5));
      if (nextSlice.length < 2) continue;
      const moveLow = Math.min(...nextSlice.map(x => x[3]));
      const impulse = c[2] - moveLow;
      if (impulse >= 1.4 * atr) {
        const obBot = Math.min(c[1], c[4]), obTop = c[2];
        const lastC = m15[n - 1];
        if (price <= obTop && price >= obBot - 0.6 * atr) {
          res.dir = 'SELL';
          res.stopLevel = obTop + 0.3 * atr;
          res.score = 70;
          res.reasons.push({ ok: true, txt: `Bearish OB di ${fmtInt(obBot)}–${fmtInt(obTop)}` });
          res.reasons.push({ ok: true, txt: 'Inducement (IDM) tersapu valid' });
          return res;
        }
      }
    }
  }
  res.reasons.push({ ok: false, txt: 'Menunggu mitigasi OB + IDM' });
  return res;
}

// 4. SMC BOS + CHOCH with Key Levels Strategy
function bosChochStrat(m15, h1, atr, price) {
  const n = m15.length;
  const res = { key: 'BOS_CHOCH', name: 'BOS & CHOCH', dir: null, score: 0, reasons: [], stopLevel: null };
  if (n < 50) return res;

  const highs = m15.map(x => x[2]);
  const lows = m15.map(x => x[3]);
  const lastC = m15[n - 1];
  const prevC = m15[n - 2];

  let keyHigh = -Infinity, keyLow = Infinity;
  const pool = m15.slice(n - 40, n - 2);
  pool.forEach(x => {
    if (x[2] > keyHigh) keyHigh = x[2];
    if (x[3] < keyLow) keyLow = x[3];
  });

  const isBullishBreak = lastC[4] > keyHigh && prevC[4] <= keyHigh;
  const isBearishBreak = lastC[4] < keyLow && prevC[4] >= keyLow;

  if (isBullishBreak) {
    let stop = keyLow - 0.3 * atr;
    res.dir = 'BUY';
    res.stopLevel = stop;
    res.score = 72;
    res.reasons.push({ ok: true, txt: `BOS Bullish: Break Key Level Resistance di ${fmtInt(keyHigh)}` });
    res.reasons.push({ ok: true, txt: `Struktur market berubah valid ke arah Bullish` });
    [
      [15, lastC[4] - lastC[1] >= 0.5 * atr, 'Displacement candle breakout kuat'],
      [10, price >= keyHigh, 'Harga stabil di atas Key Level Resistance'],
      [5, true, 'Validasi Key Level sukses']
    ].forEach(([pt, ok, txt]) => { if (ok) res.score += pt; res.reasons.push({ ok, txt }); });
    return res;
  }

  if (isBearishBreak) {
    let stop = keyHigh + 0.3 * atr;
    res.dir = 'SELL';
    res.stopLevel = stop;
    res.score = 72;
    res.reasons.push({ ok: true, txt: `CHOCH Bearish: Break Key Level Support di ${fmtInt(keyLow)}` });
    res.reasons.push({ ok: true, txt: `Struktur market berubah valid ke arah Bearish` });
    [
      [15, lastC[1] - lastC[4] >= 0.5 * atr, 'Displacement candle breakout kuat'],
      [10, price <= keyLow, 'Harga stabil di bawah Key Level Support'],
      [5, true, 'Validasi Key Level sukses']
    ].forEach(([pt, ok, txt]) => { if (ok) res.score += pt; res.reasons.push({ ok, txt }); });
    return res;
  }

  res.reasons.push({ ok: false, txt: `Menunggu breakout Key Level (${fmtInt(keyLow)} - ${fmtInt(keyHigh)})` });
  return res;
}

// Master Analyzer
function runAnalysis() {
  const cd = state.candles;
  if (!cd || !cd.m15 || !cd.h1 || cd.m15.length < 70 || cd.h1.length < 70) return null;
  const m15 = cd.m15.slice(0, -1), h1 = cd.h1.slice(0, -1);
  const atr = atrLast(m15, 14);
  if (!atr) return null;
  
  const t = trendStrat(m15, h1, atr, state.price);
  const q = liquidityStrat(m15, atr, t.dir, state.price);
  const ob = obIdmStrat(m15, h1, atr, state.price);
  const bc = bosChochStrat(m15, h1, atr, state.price);
  const allStrats = [t, q, ob, bc];

  ['BUY', 'SELL'].forEach(d => {
    const aligned = allStrats.filter(st => st.dir === d && st.score >= 55);
    if (aligned.length >= 2) {
      aligned.forEach(st => {
        st.score = Math.min(100, st.score + 10);
        st.reasons.push({ ok: true, txt: `Konfluensi ${aligned.length} Strategi Searah (+10)` });
      });
    }
  });

  const tr50 = trSeries(m15).slice(-50);
  const vr = atr / (tr50.reduce((x, y) => x + y, 0) / tr50.length);
  const volOk = vr >= 0.5 && vr <= 2.2;
  state.analysis = { atr, vr, volOk, strats: allStrats, cT: cd.m15[cd.m15.length - 1][0] };
  renderEngineUI();
  checkAutoSignal();
}

// Generate Automatic Signal Card
function checkAutoSignal() {
  const a = state.analysis;
  if (!liveOk || !a || !a.volOk) return;
  const valid = a.strats.filter(s => s.dir && s.score >= state.thr).sort((x, y) => y.score - x.score);
  if (!valid.length) return;
  if (valid.some(s => s.dir === 'BUY') && valid.some(s => s.dir === 'SELL')) return;

  const best = valid[0];
  const openSame = state.signals.find(s => s.status === 'ACTIVE' && (s.cT === a.cT || (Date.now() - s.createdAt < 30 * 60000)));
  if (openSame) return;

  const entry = state.price;
  const isBuy = best.dir === 'BUY';
  const sl = best.stopLevel != null ? best.stopLevel : (isBuy ? entry - a.atr * 1.5 : entry + a.atr * 1.5);
  const risk = Math.abs(entry - sl);
  if (risk <= 0.5 || risk > 3.5 * a.atr) return;

  const tp1 = isBuy ? entry + risk * 1.0 : entry - risk * 1.0;
  const tp2 = isBuy ? entry + risk * 2.0 : entry - risk * 2.0;
  const tp3 = isBuy ? entry + risk * 3.5 : entry - risk * 3.5;

  const newSig = {
    id: 'SIG_' + Date.now(),
    pair: 'XAUUSD',
    tf: 'M15',
    dir: best.dir,
    strat: best.name,
    score: best.score,
    rr: '1:3.5',
    entry: +entry.toFixed(2),
    sl: +sl.toFixed(2),
    tp1: +tp1.toFixed(2),
    tp2: +tp2.toFixed(2),
    tp3: +tp3.toFixed(2),
    slPips: Math.round(risk * 10),
    tp1Pips: Math.round(risk * 10),
    tp2Pips: Math.round(risk * 20),
    tp3Pips: Math.round(risk * 35),
    tp1Hit: false,
    tp2Hit: false,
    tp3Hit: false,
    status: 'ACTIVE',
    createdAt: Date.now(),
    cT: a.cT,
    reasons: best.reasons
  };

  state.signals.unshift(newSig);
  saveSignals();
  renderSignals();
}

function monitorSignals() {
  if (!liveOk) return;
  let changed = false;
  const p = state.price;

  state.signals.forEach(s => {
    if (s.status !== 'ACTIVE') return;
    const isBuy = s.dir === 'BUY';

    if (!s.tp1Hit && (isBuy ? p >= s.tp1 : p <= s.tp1)) {
      s.tp1Hit = true;
      s.sl = s.entry;
      s.beMoved = true;
      changed = true;
    }
    if (!s.tp2Hit && (isBuy ? p >= s.tp2 : p <= s.tp2)) {
      s.tp2Hit = true;
      changed = true;
    }
    if (!s.tp3Hit && (isBuy ? p >= s.tp3 : p <= s.tp3)) {
      s.tp3Hit = true;
      s.status = 'WON';
      changed = true;
    }

    if (s.status === 'ACTIVE' && (isBuy ? p <= s.sl : p >= s.sl)) {
      if (s.tp1Hit) {
        s.status = 'WON';
      } else {
        s.status = 'LOSS';
      }
      changed = true;
    }
  });

  if (changed) {
    saveSignals();
    renderSignals();
  }
}

function timeAgo(ts) {
  const mins = Math.max(1, Math.floor((Date.now() - ts) / 60000));
  if (mins < 60) return mins + 'm';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h';
  return Math.floor(hrs / 24) + 'd';
}

function renderSignals() {
  const list = $('signalsList');
  const activeCount = state.signals.filter(s => s.status === 'ACTIVE').length;
  $('activeBadge').textContent = activeCount;

  if (!state.signals.length) {
    list.innerHTML = `
      <div class="sig-card" style="text-align:center;padding:28px 16px">
        <div style="font-size:28px;margin-bottom:8px">📡</div>
        <div style="font-weight:700;font-size:15px;margin-bottom:6px">Memindai Setup Grade-A XAUUSD</div>
        <div style="font-size:12px;color:var(--muted);line-height:1.5">
          Bot otomatis menganalisis Trend, Liquidity Sweep, OB + IDM, dan BOS & CHOCH (Key Levels) dari MT5.
        </div>
      </div>`;
    return;
  }

  list.innerHTML = state.signals.map((s, idx) => {
    const isBuy = s.dir === 'BUY';
    const timeStr = new Date(s.createdAt).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    let statusHtml = '';
    if (s.status === 'ACTIVE') {
      statusHtml = s.tp1Hit
        ? `<span class="sig-status tp1">● 1 TP Hit · ${timeAgo(s.createdAt)}</span>`
        : `<span class="sig-status active">● Active · ${timeAgo(s.createdAt)}</span>`;
    } else if (s.status === 'WON') {
      statusHtml = `<span class="sig-status won">● Won · ${timeAgo(s.createdAt)}</span>`;
    } else {
      statusHtml = `<span class="sig-status loss">● SL Hit · ${timeAgo(s.createdAt)}</span>`;
    }

    return `
    <div class="sig-card">
      <div class="sig-head">
        <div class="sig-pair-wrap">
          <div class="gold-icon">Au</div>
          <span class="sig-pair">${s.pair}</span>
          <span class="dir-pill ${isBuy ? 'buy' : 'sell'}">${isBuy ? '↗ BUY' : '↘ SELL'}</span>
          <span class="rr-pill">${s.rr}</span>
        </div>
        ${statusHtml}
      </div>

      <div class="grid-3">
        <div class="lvl-box">
          <div class="lvl-lbl">ENTRY</div>
          <div class="lvl-val">${fmtInt(s.entry)}</div>
        </div>
        <div class="lvl-box sl">
          <div class="lvl-lbl">SL ${s.beMoved ? '· BE' : ''} · ${s.slPips}p</div>
          <div class="lvl-val">${fmtInt(s.sl)}</div>
        </div>
        <div class="lvl-box ${s.tp1Hit ? 'tp-hit' : ''}">
          <div class="lvl-lbl">${s.tp1Hit ? '✓ ' : ''}TP1 · ${s.tp1Pips}p</div>
          <div class="lvl-val">${fmtInt(s.tp1)}</div>
        </div>
      </div>

      <div class="grid-2">
        <div class="sub-lvl ${s.tp2Hit ? 'hit' : ''}">
          <span>${s.tp2Hit ? '✓' : '○'} TP2 <span class="price">${fmtInt(s.tp2)}</span></span>
          <span class="pips-tag">${s.tp2Pips}p</span>
        </div>
        <div class="sub-lvl ${s.tp3Hit ? 'hit' : ''}">
          <span>${s.tp3Hit ? '✓' : '○'} TP3 <span class="price">${fmtInt(s.tp3)}</span></span>
          <span class="pips-tag">${s.tp3Pips}p</span>
        </div>
      </div>

      <div class="sig-foot">
        <span>${s.tf} · ${timeStr} · ${s.strat}</span>
        <div class="foot-actions">
          <button class="foot-btn" onclick="openChartFor(${idx})">📊 Chart</button>
          <button class="foot-btn" onclick="openDetails(${idx})">Details ›</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function openChartFor(idx) {
  const navBtns = document.querySelectorAll('.nav-item');
  switchTab('chart', 'Live Chart', navBtns[1]);
}

function openDetails(idx) {
  const s = state.signals[idx];
  if (!s) return;
  $('modalTitle').textContent = `${s.pair} ${s.dir} · Skor ${s.score}/100`;
  const reasonsHtml = (s.reasons || []).map(r =>
    `<div style="margin-bottom:6px;color:${r.ok ? 'var(--green)' : 'var(--muted)'}">${r.ok ? '✓' : '•'} ${r.txt}</div>`
  ).join('');
  $('modalBody').innerHTML = `
    <div style="margin-bottom:12px;color:var(--text)">
      Strategi: <b>${s.strat}</b> | Rasio R:R <b>${s.rr}</b>
    </div>
    <div class="panel-title">Konfirmasi Teknikal MT5 & Key Levels</div>
    ${reasonsHtml}
  `;
  $('detailModal').classList.add('open');
}
function closeModal() { $('detailModal').classList.remove('open'); }

function renderChart() {
  const svg = $('chartSvg');
  const W = 320, H = 200, N = 24;
  let candles = [];
  if (state.candles && state.candles.m15 && state.candles.m15.length >= N) {
    candles = state.candles.m15.slice(-N).map(x => ({ o: x[1], h: x[2], l: x[3], c: x[4] }));
  } else {
    const s = state.hist.slice(-N);
    candles = s.map((v, i) => ({ o: i ? s[i - 1] : v, c: v, h: v + 0.8, l: v - 0.8 }));
  }
  if (!candles.length) return;

  const activeSig = state.signals.find(s => s.status === 'ACTIVE') || state.signals[0];
  const allVals = [...candles.flatMap(c => [c.h, c.l]), ...(activeSig ? [activeSig.sl, activeSig.tp1, activeSig.entry] : [])];
  const mn = Math.min(...allVals), mx = Math.max(...allVals), pad = ((mx - mn) * 0.12) || 1;
  const Y = v => 14 + (H - 28) * (1 - ((v - (mn - pad)) / ((mx + pad) - (mn - pad))));
  const cw = W / candles.length, bw = cw * 0.56;

  let out = '';
  if (activeSig) {
    [[activeSig.tp1, '#10b981', 'TP1'], [activeSig.entry, '#f59e0b', 'ENTRY'], [activeSig.sl, '#ef4444', 'SL']].forEach(([val, col, lbl]) => {
      out += `<line x1="0" x2="${W}" y1="${Y(val)}" y2="${Y(val)}" stroke="${col}" stroke-width="1" stroke-dasharray="4 3"/>`;
      out += `<text x="${W - 6}" y="${Y(val) - 3}" fill="${col}" font-size="8" text-anchor="end" font-family="monospace">${lbl} ${fmtInt(val)}</text>`;
    });
  }
  candles.forEach((c, i) => {
    const x = i * cw + cw / 2, up = c.c >= c.o, col = up ? '#10b981' : '#ef4444';
    const yo = Y(c.o), yc = Y(c.c), top = Math.min(yo, yc), bh = Math.max(Math.abs(yc - yo), 1.5);
    out += `<line x1="${x}" x2="${x}" y1="${Y(c.h)}" y2="${Y(c.l)}" stroke="${col}" stroke-width="1"/>`;
    out += `<rect x="${x - bw / 2}" y="${top}" width="${bw}" height="${bh}" fill="${col}" rx="1"/>`;
  });
  svg.innerHTML = out;

  $('activePlanBox').innerHTML = activeSig ? `
    <div class="panel-title">Setup Terakhir (${activeSig.dir})</div>
    <div class="row-item"><span>Entry</span><b>${fmt(activeSig.entry)}</b></div>
    <div class="row-item"><span>Stop Loss</span><b style="color:var(--red)">${fmt(activeSig.sl)}</b></div>
    <div class="row-item"><span>TP1 / TP2 / TP3</span><b style="color:var(--green)">${fmtInt(activeSig.tp1)} / ${fmtInt(activeSig.tp2)} / ${fmtInt(activeSig.tp3)}</b></div>
  ` : '<div style="font-size:12px;color:var(--muted)">Belum ada sinyal aktif untuk ditampilkan di chart.</div>';
}

function renderEngineUI() {
  // Pilihan threshold diperbarui mulai dari 80%, 85%, 90%, hingga 95%
  const thresholds = [80, 85, 90, 95];
  $('thrBtns').innerHTML = thresholds.map(t =>
    `<button class="btn-sec" style="margin:0;border-color:${state.thr === t ? 'var(--gold)' : 'var(--line)'};color:${state.thr === t ? 'var(--gold)' : 'var(--text)'}" onclick="setThr(${t})">${t}%</button>`
  ).join('');

  const a = state.analysis;
  if (!a) {
    $('engineRules').innerHTML = '<div style="font-size:12px;color:var(--muted)">Menunggu data candle M15 & H1 dari MT5...</div>';
    return;
  }
  $('engineRules').innerHTML = a.strats.map(st => `
    <div class="row-item">
      <div>
        <div style="font-weight:700">${st.name}</div>
        <div style="font-size:11px;color:var(--muted)">${st.dir || 'Menunggu setup'}</div>
      </div>
      <div style="text-align:right">
        <span class="dir-pill ${st.score >= state.thr ? 'buy' : ''}" style="${st.score < state.thr ? 'background:var(--card-inner);color:var(--muted)' : ''}">
          Skor ${st.score}%
        </span>
      </div>
    </div>
  `).join('');
}
function setThr(t) { state.thr = t; renderEngineUI(); checkAutoSignal(); }
function forceScan() { refreshCandles(); }

function renderStats() {
  const closed = state.signals.filter(s => s.status === 'WON' || s.status === 'LOSS');
  const won = closed.filter(s => s.status === 'WON').length;
  const wr = closed.length ? Math.round((won / closed.length) * 100) : 0;
  $('statsSummary').innerHTML = `
    <div class="panel-title">Statistik Sinyal Otomatis</div>
    <div class="grid-3" style="margin-top:8px">
      <div class="lvl-box"><div class="lvl-lbl">Total Selesai</div><div class="lvl-val">${closed.length}</div></div>
      <div class="lvl-box tp-hit"><div class="lvl-lbl">Won</div><div class="lvl-val">${won}</div></div>
      <div class="lvl-box"><div class="lvl-lbl">Win Rate</div><div class="lvl-val">${closed.length ? wr + '%' : '—'}</div></div>
    </div>
  `;
  const bt = state.bt;
  $('btPanel').innerHTML = bt && bt.modes && bt.modes.LIVE ? `
    <div class="panel-title">Hasil Backtest MT5 (${bt.from} - ${bt.to})</div>
    <div class="row-item"><span>Total Trade Historis</span><b>${bt.modes.LIVE.all.n}</b></div>
    <div class="row-item"><span>Win Rate Historis</span><b style="color:var(--green)">${bt.modes.LIVE.all.wr}%</b></div>
    <div class="row-item"><span>Expectancy</span><b>${bt.modes.LIVE.all.exp}R / trade</b></div>
  ` : '<div class="panel-title">Backtest MT5</div><div style="font-size:12px;color:var(--muted)">Jalankan backtest.py di PC untuk menampilkan data historis di sini.</div>';
}

function clearHistory() {
  if (!confirm('Hapus semua riwayat sinyal?')) return;
  state.signals = [];
  saveSignals();
  renderSignals();
  renderStats();
}

async function pollPrice() {
  const prev = state.price;
  const d = await jsonpGet('', res => res && isFinite(Number(res.price)) && Number(res.price) > 0);
  if (d) {
    state.price = Number(d.price);
    liveOk = true;
    $('connDot').classList.remove('sim');
    $('connText').textContent = 'MT5 LIVE';
  } else {
    state.price += (Math.random() - 0.5) * 2.5;
    liveOk = false;
    $('connDot').classList.add('sim');
    $('connText').textContent = 'SIMULASI';
  }
  state.hist.push(state.price);
  if (state.hist.length > 60) state.hist.shift();

  $('livePrice').textContent = fmt(state.price);
  const diff = state.price - prev;
  $('priceChg').textContent = `${diff >= 0 ? '▲' : '▼'} ${fmt(Math.abs(diff))}`;
  $('priceChg'].style.color = diff >= 0 ? 'var(--green)' : 'var(--red)';

  monitorSignals();
}

async function refreshCandles() {
  const cd = await jsonpGet('candles=1', d => d && d.m15 && d.h1);
  if (cd) {
    state.candles = cd;
    runAnalysis();
  }
}

async function loadBacktest() {
  const bt = await jsonpGet('bt=1', d => d && d.modes);
  if (bt) { state.bt = bt; }
}

for (let i = 0; i < 30; i++) state.hist.push(state.price + (Math.random() - 0.5) * 4);
renderSignals();
renderEngineUI();
pollPrice().then(refreshCandles);
loadBacktest();
setInterval(pollPrice, POLL_MS);
setInterval(refreshCandles, CANDLE_POLL_MS);
</script>
