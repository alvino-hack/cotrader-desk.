<style>
:root {
  --bg: #08090a;
  --card: #121417;
  --card-inner: #191c21;
  --line: #23272e;
  --text: #f3f4f6;
  --muted: #8b949e;
  --green: #10b981;
  --green-bg: rgba(16, 185, 129, 0.14);
  --red: #ef4444;
  --red-bg: rgba(239, 68, 68, 0.14);
  --gold: #f59e0b;
  --gold-bg: rgba(245, 158, 11, 0.14);
  color-scheme: dark;
}
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  -ms-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg); color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}
body {
  display: flex; flex-direction: column; overflow: hidden;
  padding-top: env(safe-area-inset-top, 0px);
}

/* Header */
.topbar {
  flex: 0 0 auto;
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 18px 10px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.topbar h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
.live-badge {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 600; color: var(--muted);
  background: var(--card); border: 1px solid var(--line);
  padding: 5px 10px; border-radius: 999px;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
.dot.sim { background: var(--gold); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

/* Ticker Strip */
.ticker {
  flex: 0 0 auto;
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 18px;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  font-size: 12px;
}
.ticker-price { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 15px; }

/* Main Scrollable Views */
.view-container {
  flex: 1 1 auto; overflow-y: auto;
  padding: 14px 16px 90px;
  scrollbar-width: none;
}
.view-container::-webkit-scrollbar { display: none; }
.tab-view { display: none; }
.tab-view.active { display: block; animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* Signal Card */
.sig-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 14px;
}
.sig-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 12px;
}
.sig-pair-wrap { display: flex; align-items: center; gap: 8px; }
.gold-icon {
  width: 28px; height: 28px; border-radius: 50%;
  background: linear-gradient(135deg, #fbbf24, #d97706);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800; color: #111;
}
.sig-pair { font-weight: 800; font-size: 16px; letter-spacing: 0.01em; }
.dir-pill {
  font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px;
  display: inline-flex; align-items: center; gap: 3px;
}
.dir-pill.buy { background: var(--green-bg); color: var(--green); }
.dir-pill.sell { background: var(--red-bg); color: var(--red); }
.rr-pill {
  font-size: 11px; font-weight: 600; color: var(--muted);
  background: var(--card-inner); border: 1px solid var(--line);
  padding: 3px 7px; border-radius: 6px;
}
.sig-status { font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
.sig-status.active { color: var(--green); }
.sig-status.won { color: var(--green); }
.sig-status.tp1 { color: var(--gold); }
.sig-status.loss { color: var(--red); }

/* Grid 3 */
.grid-3 {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;
  margin-bottom: 8px;
}
.lvl-box {
  background: var(--card-inner);
  border-radius: 10px;
  padding: 9px 6px;
  text-align: center;
  border: 1px solid rgba(255,255,255,0.03);
}
.lvl-box.sl { background: rgba(239, 68, 68, 0.09); border-color: rgba(239, 68, 68, 0.2); }
.lvl-box.tp-hit { background: rgba(16, 185, 129, 0.12); border-color: rgba(16, 185, 129, 0.25); }
.lvl-lbl { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
.lvl-box.sl .lvl-lbl { color: #fca5a5; }
.lvl-box.tp-hit .lvl-lbl { color: #6ee7b7; }
.lvl-val { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; }
.lvl-box.sl .lvl-val { color: var(--red); }
.lvl-box.tp-hit .lvl-val { color: var(--green); }

/* Grid 2 */
.grid-2 {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  margin-bottom: 12px;
}
.sub-lvl {
  background: var(--card-inner);
  border-radius: 8px;
  padding: 7px 10px;
  display: flex; justify-content: space-between; align-items: center;
  font-size: 12px;
}
.sub-lvl.hit { background: rgba(16, 185, 129, 0.12); color: var(--green); }
.sub-lvl span.price { font-family: 'JetBrains Mono', monospace; font-weight: 700; }
.pips-tag {
  font-size: 10px; font-weight: 600; color: var(--muted);
  background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px;
}

/* Card Footer */
.sig-foot {
  display: flex; justify-content: space-between; align-items: center;
  padding-top: 10px; border-top: 1px solid var(--line);
  font-size: 11px; color: var(--muted);
}
.foot-actions { display: flex; gap: 14px; align-items: center; }
.foot-btn {
  background: none; border: none; color: var(--text);
  font-family: inherit; font-size: 12px; font-weight: 600;
  cursor: pointer; padding: 0; display: flex; align-items: center; gap: 4px;
}
.foot-btn.gold { color: var(--gold); }

/* Panel */
.panel {
  background: var(--card); border: 1px solid var(--line);
  border-radius: 14px; padding: 14px; margin-bottom: 12px;
}
.panel-title { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
.chart-svg { width: 100%; height: 210px; display: block; background: var(--card-inner); border-radius: 10px; }
.row-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px;
}
.row-item:last-child { border-bottom: none; }
.btn-action {
  width: 100%; padding: 12px; border-radius: 10px; border: none;
  background: var(--gold); color: #111; font-weight: 700; font-size: 13px;
  cursor: pointer; margin-top: 8px;
}
.btn-sec {
  width: 100%; padding: 10px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--card-inner);
  color: var(--text); font-weight: 600; font-size: 12px; cursor: pointer; margin-top: 8px;
}
.btn-notif {
  width: 100%; padding: 11px; border-radius: 10px;
  border: 1px solid var(--green); background: var(--green-bg);
  color: var(--green); font-weight: 700; font-size: 12px; cursor: pointer;
}

/* Modal */
.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75);
  display: none; align-items: flex-end; justify-content: center; z-index: 50;
}
.modal-bg.open { display: flex; }
.modal-sheet {
  width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto;
  background: var(--card);
  border-top: 1px solid var(--line); border-radius: 20px 20px 0 0;
  padding: 18px 18px calc(24px + env(safe-area-inset-bottom, 0px));
}

/* Bottom Nav */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(12, 13, 15, 0.96);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding: 8px 4px calc(8px + env(safe-area-inset-bottom, 0px));
  z-index: 30;
}
.nav-item {
  background: none; border: none; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 4px;

  position: relative;
}
.nav-item.active { color: var(--gold); }
.nav-icon { font-size: 18px; line-height: 1; }
.badge-count {
  position: absolute; top: -2px; right: 24%;
  background: var(--green); color: #051b11;
  font-size: 9px; font-weight: 800; padding: 1px 5px; border-radius: 999px;
}

<script>
const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtInt = n => Number(n).toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });

const WORKER_URL = "https://script.google.com/macros/s/AKfycbwoFPgcEw52vFAdloE494I_0EmLb_c0dUdau3qolKnif_Ywe5btJL7qLJ5E8xG7zh-N/exec";
const POLL_MS = 5000;
const CANDLE_POLL_MS = 25000;

let liveOk = false;
let wakeLock = null;
const state = {
  price: 3865.00,
  hist: [],
  candles: null,
  analysis: null,
  thr: 80,
  signals: [],
  bt: null
};

try {
  const saved = JSON.parse(localStorage.getItem('eb_auto_signals_v2') || '[]');
  if (Array.isArray(saved)) state.signals = saved;
} catch (e) {}

function saveSignals() {
  try { localStorage.setItem('eb_auto_signals_v2', JSON.stringify(state.signals.slice(0, 50))); } catch (e) {}
}

// --- SISTEM NOTIFIKASI & SUARA LANGSUNG DARI APLIKASI ---
function playAlertTone() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, ctx.currentTime); // Nada A5 jernih
    osc.frequency.exponentialRampToValueAtTime(1318.5, ctx.currentTime + 0.15); // Naik ke E6
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.45);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.45);
  } catch (e) {}
}

function updateNotifUI() {
  if (!('Notification' in window)) {
    $('notifStatusText').textContent = 'Tidak Didukung Browser';
    return;
  }
  const perm = Notification.permission;
  if (perm === 'granted') {
    $('notifBanner').style.display = 'none';
    $('notifStatusText').textContent = 'AKTIF (ON)';
    $('notifStatusText').style.color = 'var(--green)';
  } else if (perm === 'denied') {
    $('notifBanner').style.display = 'none';
    $('notifStatusText').textContent = 'DIBLOKIR (Cek Pengaturan HP)';
    $('notifStatusText').style.color = 'var(--red)';
  } else {
    $('notifBanner').style.display = 'block';
    $('notifStatusText').textContent = 'BELUM DIAKTIFKAN';
    $('notifStatusText').style.color = 'var(--gold)';
  }
}

async function requestNotifPermission() {
  if (!('Notification' in window)) return alert('Browser ini tidak mendukung notifikasi.');
  const perm = await Notification.requestPermission();
  updateNotifUI();
  if (perm === 'granted') {
    testNotification();
  }
}

function sendAppNotification(title, body) {
  playAlertTone();
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);

  if ('Notification' in window && Notification.permission === 'granted') {
    const opts = {
      body: body,
      icon: 'icon-192.png',
      badge: 'icon-192.png',
      vibrate: [200, 100, 200],
      tag: 'ekebilas-signal-' + Date.now(),
      renotify: true
    };
    if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
      navigator.serviceWorker.ready.then(reg => reg.showNotification(title, opts));
    } else {
      new Notification(title, opts);
    }
  }
}

function testNotification() {
  sendAppNotification(
    '🔔 Tes Sinyal Ekebilas Bot',
    'Notifikasi aktif! Sinyal Zero-Floating akan muncul otomatis di sini.'
  );
}

// Menjaga layar/koneksi tetap terjaga saat aplikasi aktif
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    requestWakeLock();
    pollPrice();
  }
});

// Registrasi Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// --- NAVIGASI & DATA ---
function switchTab(tabId, title, btn) {
  $('pageTitle').textContent = title;
  document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('active'));
  $('view-' + tabId).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (tabId === 'chart') renderChart();
  if (tabId === 'stats') renderStats();
  if (tabId === 'ai') updateNotifUI();
}

function jsonpGet(qs, validate) {
  return new Promise(resolve => {
    if (!WORKER_URL.startsWith('http')) return resolve(null);
    const name = 'cb_' + Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    const done = val => { try { delete window[name]; } catch (e) {} s.remove(); resolve(val); };
    window[name] = d => done(validate(d) ? d : null);
    s.onerror = () => done(null);
    setTimeout(() => done(null), 9000);
    s.src = WORKER_URL + (WORKER_URL.includes('?') ? '&' : '?') + qs + (qs ? '&' : '') + 'callback=' + name;
    document.body.appendChild(s);
  });
}

function emaArr(v, n) {
  const k = 2 / (n + 1);
  let e = v[0];
  const o = [e];
  for (let i = 1; i < v.length; i++) { e = v[i] * k + e * (1 - k); o.push(e); }
  return o;
}
function trSeries(c) {
  const tr = [];
  for (let i = 1; i < c.length; i++) {
    const h = c[i][2], l = c[i][3], pc = c[i - 1][4];
    tr.push(Math.max(h - l, Math.abs(h - pc), Math.abs(l - pc)));
  }
  return tr;
}
function atrLast(c, n = 14) {
  const tr = trSeries(c);
  if (tr.length < n) return null;
  let a = tr.slice(0, n).reduce((x, y) => x + y, 0) / n;
  for (let i = n; i < tr.length; i++) a = (a * (n - 1) + tr[i]) / n;
  return a;
}

// 1. ALCHEMIST ZERO-FLOATING STRATEGY
function alchemistStrat(m15, h1, atr, price) {
  const n = m15.length;
  const res = { key: 'ALCHEMIST', name: 'Alchemist Zero-Floating', dir: null, score: 0, reasons: [], stopLevel: null };
  if (n < 50 || !h1 || h1.length < 30) return res;

  const rangeSlice = m15.slice(-48);
  const rangeHigh = Math.max(...rangeSlice.map(x => x[2]));
  const rangeLow = Math.min(...rangeSlice.map(x => x[3]));
  const eq = (rangeHigh + rangeLow) / 2;
  const rangeSpan = Math.max(rangeHigh - rangeLow, 1e-9);
  const inPremium = price > eq;
  const inDiscount = price < eq;

  const h1Closes = h1.map(x => x[4]);
  const e20h = emaArr(h1Closes, 20);
  const h1Bull = h1Closes[h1Closes.length - 1] > e20h[e20h.length - 1];
  const h1Bear = h1Closes[h1Closes.length - 1] < e20h[e20h.length - 1];

  const pool = m15.slice(-25, -2);
  const bsl = Math.max(...pool.map(x => x[2]));
  const ssl = Math.min(...pool.map(x => x[3]));
  const lastC = m15[n - 1];
  const prevC = m15[n - 2];

  const highSweep = (lastC[2] > bsl && lastC[4] < bsl) || (prevC[2] > bsl && lastC[4] < bsl);
  const lowSweep = (lastC[3] < ssl && lastC[4] > ssl) || (prevC[3] < ssl && lastC[4] > ssl);

  const bodySize = Math.abs(lastC[4] - lastC[1]);
  const hasDisplacement = bodySize >= 0.6 * atr;
  const bullishCISD = hasDisplacement && lastC[4] > prevC[2];
  const bearishCISD = hasDisplacement && lastC[4] < prevC[3];

  const fibRetrace = inDiscount ? (rangeHigh - price) / rangeSpan : (price - rangeLow) / rangeSpan;
  const inOTE = fibRetrace >= 0.618 && fibRetrace <= 0.79;

  const isZeroFloatingBuy = inDiscount && (lowSweep || Math.abs(price - ssl) <= 0.65 * atr || inOTE);
  const isZeroFloatingSell = inPremium && (highSweep || Math.abs(price - bsl) <= 0.65 * atr || inOTE);

  if (isZeroFloatingBuy && (bullishCISD || h1Bull || lowSweep)) {
    res.dir = 'BUY';
    res.stopLevel = Math.min(ssl, lastC[3], prevC[3]) - 0.25 * atr;
    let pts = 35;
    res.reasons.push({ ok: true, txt: `Zero-Floating BUY: Harga di titik ekstrem Discount (${fmtInt(price)})` });
    if (lowSweep) { pts += 25; res.reasons.push({ ok: true, txt: `SSL Liquidity Sweep tuntas di ${fmtInt(ssl)}` }); }
    if (bullishCISD) { pts += 20; res.reasons.push({ ok: true, txt: 'Bullish CISD Displacement instan' }); }
    if (inOTE) { pts += 10; res.reasons.push({ ok: true, txt: `OTE Fibonacci Zone akurat (${(fibRetrace * 100).toFixed(1)}%)` }); }
    if (h1Bull) { pts += 10; res.reasons.push({ ok: true, txt: 'HTF Bias H1 Bullish' }); }
    res.score = Math.min(100, pts);
    return res;
  }

  if (isZeroFloatingSell && (bearishCISD || h1Bear || highSweep)) {
    res.dir = 'SELL';
    res.stopLevel = Math.max(bsl, lastC[2], prevC[2]) + 0.25 * atr;
    let pts = 35;
    res.reasons.push({ ok: true, txt: `Zero-Floating SELL: Harga di titik ekstrem Premium (${fmtInt(price)})` });
    if (highSweep) { pts += 25; res.reasons.push({ ok: true, txt: `BSL Liquidity Sweep tuntas di ${fmtInt(bsl)}` }); }
    if (bearishCISD) { pts += 20; res.reasons.push({ ok: true, txt: 'Bearish CISD Displacement instan' }); }
    if (inOTE) { pts += 10; res.reasons.push({ ok: true, txt: `OTE Fibonacci Zone akurat (${(fibRetrace * 100).toFixed(1)}%)` }); }
    if (h1Bear) { pts += 10; res.reasons.push({ ok: true, txt: 'HTF Bias H1 Bearish' }); }
    res.score = Math.min(100, pts);
    return res;
  }

  res.reasons.push({ ok: false, txt: 'Menunggu titik ekstrem untuk Zero-Floating Entry' });
  return res;
}

// 2. OB + INDUCEMENT ZERO-FLOATING MURNI
function obIdmStrat(m15, h1, atr, price) {
  const n = m15.length;
  const res = { key: 'OB_IDM', name: 'OB + Inducement (Zero-Float)', dir: null, score: 0, reasons: [], stopLevel: null };
  if (n < 50) return res;

  const h1Closes = h1.map(x => x[4]);
  const e20h = emaArr(h1Closes, 20);
  const h1Bull = h1Closes[h1Closes.length - 1] > e20h[e20h.length - 1];
  const h1Bear = h1Closes[h1Closes.length - 1] < e20h[e20h.length - 1];
  const lastC = m15[n - 1];

  for (let i = n - 6; i >= n - 30; i--) {
    const c = m15[i];
    if (c[4] < c[1]) {
      const nextSlice = m15.slice(i + 1, Math.min(n - 1, i + 5));
      if (nextSlice.length < 2) continue;
      const moveHigh = Math.max(...nextSlice.map(x => x[2]));
      const impulse = moveHigh - c[3];
      if (impulse >= 1.3 * atr) {
        const obTop = Math.max(c[1], c[4]), obBot = c[3];
        const lowWick = Math.min(lastC[3], lastC[4]);
        if (lowWick <= obTop && lastC[4] >= obBot && lastC[4] > lastC[1]) {
          res.dir = 'BUY';
          res.stopLevel = obBot - 0.2 * atr;
          let pts = 70;
          res.reasons.push({ ok: true, txt: `Zero-Float Bullish OB: Pantulan instan di ${fmtInt(obBot)}–${fmtInt(obTop)}` });
          res.reasons.push({ ok: true, txt: 'Inducement (IDM) tersapu & rejection valid' });
          if (h1Bull) { pts += 15; res.reasons.push({ ok: true, txt: 'Trend H1 Bullish selaras' }); }
          res.score = Math.min(100, pts);
          return res;
        }
      }
    }
    if (c[4] > c[1]) {
      const nextSlice = m15.slice(i + 1, Math.min(n - 1, i + 5));
      if (nextSlice.length < 2) continue;
      const moveLow = Math.min(...nextSlice.slice(0, -1).map(x => x[3]));
      const impulse = c[2] - moveLow;
      if (impulse >= 1.3 * atr) {
        const obBot = Math.min(c[1], c[4]), obTop = c[2];
        const highWick = Math.max(lastC[2], lastC[4]);
        if (highWick >= obBot && lastC[4] <= obTop && lastC[4] < lastC[1]) {
          res.dir = 'SELL';
          res.stopLevel = obTop + 0.2 * atr;
          let pts = 70;
          res.reasons.push({ ok: true, txt: `Zero-Float Bearish OB: Pantulan instan di ${fmtInt(obBot)}–${fmtInt(obTop)}` });
          res.reasons.push({ ok: true, txt: 'Inducement (IDM) tersapu & rejection valid' });
          if (h1Bear) { pts += 15; res.reasons.push({ ok: true, txt: 'Trend H1 Bearish selaras' }); }
          res.score = Math.min(100, pts);
          return res;
        }
      }
    }
  }
  res.reasons.push({ ok: false, txt: 'Menunggu konfirmasi pantulan instan OB + IDM' });
  return res;
}

// Master Analyzer
function runAnalysis() {
  const cd = state.candles;
  if (!cd || !cd.m15 || !cd.h1 || cd.m15.length < 70 || cd.h1.length < 70) return null;
  const m15 = cd.m15.slice(0, -1), h1 = cd.h1.slice(0, -1);
  const atr = atrLast(m15, 14);
  if (!atr) return null;
  
  const alc = alchemistStrat(m15, h1, atr, state.price);
  const ob = obIdmStrat(m15, h1, atr, state.price);
  const allStrats = [alc, ob];

  ['BUY', 'SELL'].forEach(d => {
    const aligned = allStrats.filter(st => st.dir === d && st.score >= 65);
    if (aligned.length >= 2) {
      aligned.forEach(st => {
        st.score = Math.min(100, st.score + 15);
        st.reasons.push({ ok: true, txt: `Konfluensi Institusi (Alchemist + OB/IDM Searah) (+15)` });
      });
    }
  });

  const tr50 = trSeries(m15).slice(-50);
  const vr = atr / (tr50.reduce((x, y) => x + y, 0) / tr50.length);
  const volOk = vr >= 0.5 && vr <= 2.2;
  state.analysis = { atr, vr, volOk, strats: allStrats, cT: cd.m15[cd.m15.length - 1][0] };
  renderEngineUI();
  checkAutoSignal();
}

// Generate Automatic Signal Card + TRIGGER NOTIFIKASI HP
function checkAutoSignal() {
  const a = state.analysis;
  if (!liveOk || !a || !a.volOk) return;
  const valid = a.strats.filter(s => s.dir && s.score >= state.thr).sort((x, y) => y.score - x.score);
  if (!valid.length) return;
  if (valid.some(s => s.dir === 'BUY') && valid.some(s => s.dir === 'SELL')) return;

  const best = valid[0];
  const openSame = state.signals.find(s => s.status === 'ACTIVE' && (s.cT === a.cT || (Date.now() - s.createdAt < 30 * 60000)));
  if (openSame) return;

  const entry = state.price;
  const isBuy = best.dir === 'BUY';

  let sl, tp1, tp2, tp3, risk;
  if (isBuy) {
    sl = (best.stopLevel != null && best.stopLevel < entry) ? best.stopLevel : (entry - a.atr * 1.2);
    risk = Math.abs(entry - sl);
    tp1 = entry + risk * 1.0;
    tp2 = entry + risk * 2.0;
    tp3 = entry + risk * 3.5;
  } else {
    sl = (best.stopLevel != null && best.stopLevel > entry) ? best.stopLevel : (entry + a.atr * 1.2);
    risk = Math.abs(sl - entry);
    tp1 = entry - risk * 1.0;
    tp2 = entry - risk * 2.0;
    tp3 = entry - risk * 3.5;
  }

  if (risk <= 0.3 || risk > 3.5 * a.atr) return;

  const newSig = {
    id: 'SIG_' + Date.now(),
    pair: 'XAUUSD',
    tf: 'M15',
    dir: best.dir,
    strat: best.name,
    score: best.score,
    rr: '1:3.5',
    entry: +entry.toFixed(2),
    sl: +sl.toFixed(2),
    tp1: +tp1.toFixed(2),
    tp2: +tp2.toFixed(2),
    tp3: +tp3.toFixed(2),
    slPips: Math.round(risk * 10),
    tp1Pips: Math.round(risk * 10),
    tp2Pips: Math.round(risk * 20),
    tp3Pips: Math.round(risk * 35),
    tp1Hit: false,
    tp2Hit: false,
    tp3Hit: false,
    status: 'ACTIVE',
    createdAt: Date.now(),
    cT: a.cT,
    reasons: best.reasons
  };

  state.signals.unshift(newSig);
  saveSignals();
  renderSignals();

  // KIRIM NOTIFIKASI HP LANGSUNG
  sendAppNotification(
    `🚨 XAUUSD ${newSig.dir} (${newSig.strat})`,
    `Entry: ${fmtInt(newSig.entry)} | SL: ${fmtInt(newSig.sl)} | TP1: ${fmtInt(newSig.tp1)} (Skor ${newSig.score}%)`
  );
}

function monitorSignals() {
  if (!liveOk) return;
  let changed = false;
  const p = state.price;

  state.signals.forEach(s => {
    if (s.status !== 'ACTIVE') return;
    const isBuy = s.dir === 'BUY';

    if (!s.tp1Hit && (isBuy ? p >= s.tp1 : p <= s.tp1)) {
      s.tp1Hit = true;
      s.sl = s.entry;
      s.beMoved = true;
      changed = true;
      sendAppNotification(`✅ TP1 HIT! XAUUSD ${s.dir}`, `Profit aman di ${fmtInt(s.tp1)}! SL digeser ke BE (${fmtInt(s.entry)}).`);
    }
    if (!s.tp2Hit && (isBuy ? p >= s.tp2 : p <= s.tp2)) {
      s.tp2Hit = true;
      changed = true;
      sendAppNotification(`🔥 TP2 HIT! XAUUSD ${s.dir}`, `Target TP2 tercapai di ${fmtInt(s.tp2)}!`);
    }
    if (!s.tp3Hit && (isBuy ? p >= s.tp3 : p <= s.tp3)) {
      s.tp3Hit = true;
      s.status = 'WON';
      changed = true;
      sendAppNotification(`🏆 FULL TP3 WON! XAUUSD ${s.dir}`, `Sinyal selesai dengan profit penuh di ${fmtInt(s.tp3)}!`);
    }

    if (s.status === 'ACTIVE' && (isBuy ? p <= s.sl : p >= s.sl)) {
      if (s.tp1Hit) {
        s.status = 'WON';
      } else {
        s.status = 'LOSS';
        sendAppNotification(`❌ SL HIT XAUUSD ${s.dir}`, `Harga menyentuh SL di ${fmtInt(s.sl)}.`);
      }
      changed = true;
    }
  });

  if (changed) {
    saveSignals();
    renderSignals();
  }
}

function timeAgo(ts) {
  const mins = Math.max(1, Math.floor((Date.now() - ts) / 60000));
  if (mins < 60) return mins + 'm';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h';
  return Math.floor(hrs / 24) + 'd';
}

function closeModal() { $('detailModal').classList.remove('open'); }

function renderChart() {
  const svg = $('chartSvg');
  const W = 320, H = 200, N = 24;
  let candles = [];
  if (state.candles && state.candles.m15 && state.candles.m15.length >= N) {
    candles = state.candles.m15.slice(-N).map(x => ({ o: x[1], h: x[2], l: x[3], c: x[4] }));
  } else {
    const s = state.hist.slice(-N);
    candles = s.map((v, i) => ({ o: i ? s[i - 1] : v, c: v, h: v + 0.8, l: v - 0.8 }));
  }
  if (!candles.length) return;

  const activeSig = state.signals.find(s => s.status === 'ACTIVE') || state.signals[0];
  const allVals = [...candles.flatMap(c => [c.h, c.l]), ...(activeSig ? [activeSig.sl, activeSig.tp1, activeSig.entry] : [])];
  const mn = Math.min(...allVals), mx = Math.max(...allVals), pad = ((mx - mn) * 0.12) || 1;
  const Y = v => 14 + (H - 28) * (1 - ((v - (mn - pad)) / ((mx + pad) - (mn - pad))));
  const cw = W / candles.length, bw = cw * 0.56;

  let out = '';
  if (activeSig) {
    [[activeSig.tp1, '#10b981', 'TP1'], [activeSig.entry, '#f59e0b', 'ENTRY'], [activeSig.sl, '#ef4444', 'SL']].forEach(([val, col, lbl]) => {
      out += `<line x1="0" x2="${W}" y1="${Y(val)}" y2="${Y(val)}" stroke="${col}" stroke-width="1" stroke-dasharray="4 3"/>`;
      out += `<text x="${W - 6}" y="${Y(val) - 3}" fill="${col}" font-size="8" text-anchor="end" font-family="monospace">${lbl} ${fmtInt(val)}</text>`;
    });
  }
  candles.forEach((c, i) => {
    const x = i * cw + cw / 2, up = c.c >= c.o, col = up ? '#10b981' : '#ef4444';
    const yo = Y(c.o), yc = Y(c.c), top = Math.min(yo, yc), bh = Math.max(Math.abs(yc - yo), 1.5);
    out += `<line x1="${x}" x2="${x}" y1="${Y(c.h)}" y2="${Y(c.l)}" stroke="${col}" stroke-width="1"/>`;
    out += `<rect x="${x - bw / 2}" y="${top}" width="${bw}" height="${bh}" fill="${col}" rx="1"/>`;
  });
  svg.innerHTML = out;

  $('activePlanBox').innerHTML = activeSig ? `
    <div class="panel-title">Setup Terakhir (${activeSig.dir})</div>
    <div class="row-item"><span>Entry</span><b>${fmt(activeSig.entry)}</b></div>
    <div class="row-item"><span>Stop Loss</span><b style="color:var(--red)">${fmt(activeSig.sl)}</b></div>
    <div class="row-item"><span>TP1 / TP2 / TP3</span><b style="color:var(--green)">${fmtInt(activeSig.tp1)} / ${fmtInt(activeSig.tp2)} / ${fmtInt(activeSig.tp3)}</b></div>
  ` : '<div style="font-size:12px;color:var(--muted)">Belum ada sinyal aktif untuk ditampilkan di chart.</div>';
}

  $('thrBtns').innerHTML = [75, 80, 85, 90].map(t =>

function setThr(t) { state.thr = t; renderEngineUI(); checkAutoSignal(); }

  ` : '<div class="panel-title">Backtest MT5</div><div style="font-size:12px;color:var(--muted)">Jalankan backtest.py di PC untuk menampilkan data historis di sini.</div>';
}

function clearHistory() {
  if (!confirm('Hapus semua riwayat sinyal?')) return;
  state.signals = [];
  saveSignals();
  renderSignals();
  renderStats();
}

async function pollPrice() {
  const prev = state.price;
  const d = await jsonpGet('', res => res && isFinite(Number(res.price)) && Number(res.price) > 0);
  if (d) {
    state.price = Number(d.price);
    liveOk = true;
    $('connDot').classList.remove('sim');
    $('connText').textContent = 'MT5 LIVE';
  } else {
    state.price += (Math.random() - 0.5) * 2.5;
    liveOk = false;
    $('connDot').classList.add('sim');
    $('connText').textContent = 'SIMULASI';
  }
  state.hist.push(state.price);
  if (state.hist.length > 60) state.hist.shift();

  $('livePrice').textContent = fmt(state.price);
  const diff = state.price - prev;
  $('priceChg').textContent = `${diff >= 0 ? '▲' : '▼'} ${fmt(Math.abs(diff))}`;
  $('priceChg').style.color = diff >= 0 ? 'var(--green)' : 'var(--red)';

  monitorSignals();
}

async function refreshCandles() {
  const cd = await jsonpGet('candles=1', d => d && d.m15 && d.h1);
  if (cd) {
    state.candles = cd;
    runAnalysis();
  }
}

async function loadBacktest() {
  const bt = await jsonpGet('bt=1', d => d && d.modes);
  if (bt) { state.bt = bt; }
}

for (let i = 0; i < 30; i++) state.hist.push(state.price + (Math.random() - 0.5) * 4);

renderSignals();

pollPrice().then(refreshCandles);
loadBacktest();
